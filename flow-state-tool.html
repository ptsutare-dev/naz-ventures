/* One element per screen. The framework explanation that used to sit above
   these fields is gone: it taught vocabulary the glossary already covers,
   and it was the densest block on the first screen anyone reaches. */
/* =========================================================================
   QUICK-PICK ENTRY
   The very first thing anyone sees. A blank paragraph box is the single
   biggest reason someone closes the tab before they've told it anything —
   so the first touch is a tap, not an essay. Options are written for MSME
   reality specifically (a food cart, a sari-sari store) rather than a
   generic startup taxonomy (Retail / Technology / Finance) that a small
   business owner would not recognise themselves in.

   The picked option still lands in opportunitySnapshot[key].assumption as
   an ordinary string, so every downstream coach, generator and gate that
   already reads assumptionText() keeps working unchanged — only the input
   widget got lighter, not the data shape.
   ========================================================================= */
const STARTING_POINTS = [
  { id: "idea", label: "I have a business idea", order: ["solution", "customer", "problem"] },
  { id: "customer", label: "I want to serve a specific customer", order: ["customer", "problem", "solution"] },
  { id: "problem", label: "I found a problem", order: ["problem", "customer", "solution"] },
];
function snapshotOrder(v) {
  const sp = STARTING_POINTS.find(s => s.id === v.startingPoint);
  return sp ? sp.order : ["problem", "customer", "solution"];
}
/* Third entry is the same option written in the third person, so it can drop
   straight into the starting statement without reading like a form field. */
const INDUSTRY_OPTIONS = [
  ["sari-sari", "Sari-sari store or small retail shop", "a sari-sari store nearby"],
  ["foodcart", "Food cart, karinderya, or eatery", "a place to eat nearby"],
  ["reselling", "Online reselling or online shop", "an online shop they can order from"],
  ["services", "Services — repair, laundry, salon, and similar", "a repair, laundry or salon service nearby"],
  ["agri", "Farming or agri-business", "farm produce they can get nearby"],
  ["delivery", "Delivery, transport, or logistics", "a delivery or transport service"],
  ["other", "Something else", ""],
];
const CUSTOMER_SEGMENT_OPTIONS = [
  ["neighbors", "People in my neighborhood or community", "people in the neighborhood"],
  ["students", "Students", "students"],
  ["commuters", "Commuters or workers nearby", "commuters and workers nearby"],
  ["online", "Online buyers", "online buyers"],
  ["b2b", "Other small businesses", "other small businesses"],
  ["other", "Something else", ""],
];
/* Pain point, need and gap are the categories — they lead, because the whole
   point is to teach the three shapes a problem comes in. Underneath each one
   sits the sentence a person would actually say to themselves, which is what
   makes an abstract category recognisable without a definition. */
const PROBLEM_TYPE_OPTIONS = [
  ["pain-point", "Pain point", "I don't want this anymore."],
  ["need", "Need", "I need this."],
  ["gap", "Gap", "I want this."],
];
function problemTypeLabel(id) {
  const found = PROBLEM_TYPE_OPTIONS.find(o => o[0] === id);
  return found ? t(found[1]) : "";
}
function optionLabel(options, id) {
  const found = options.find(o => o[0] === id);
  return found ? found[1] : "";
}

/* Renders a labelled <select>, with an "Other" text box that reveals only
   when needed — never two widgets fighting for attention at once.
   `pick` and `text` are passed separately (not inferred from one value) so
   a value typed into "Other" survives a revisit intact, and an assumption
   written before this picker existed — free text that matches no option —
   still shows up as "Other" with its original wording, rather than
   silently vanishing behind a blank "choose one". */
function quickPickSelect(id, options, pick, text) {
  const effectivePick = pick || (text ? "other" : "");
  return `
    <select id="${id}" data-quickpick-select>
      <option value="">${esc(t("— choose one —"))}</option>
      ${options.map(([val, label]) => `<option value="${esc(val)}" ${effectivePick === val ? "selected" : ""}>${esc(t(label))}</option>`).join("")}
    </select>
    <input type="text" id="${id}_other" style="margin-top:8px;display:${effectivePick === "other" ? "block" : "none"}"
           placeholder="${esc(t("Type your own"))}" value="${esc(effectivePick === "other" ? (text || "") : "")}">`;
}
function bindQuickPickSelect(id) {
  const sel = document.getElementById(id);
  const other = document.getElementById(id + "_other");
  sel?.addEventListener("change", () => {
    other.style.display = sel.value === "other" ? "block" : "none";
    if (sel.value === "other") other.focus();
  });
}
function quickPickValue(id, options) {
  const sel = document.getElementById(id);
  if (!sel) return null;
  if (sel.value === "other") {
    const other = document.getElementById(id + "_other");
    return (other?.value || "").trim();
  }
  return sel.value ? optionLabel(options, sel.value) : "";
}
function quickPickRawId(id) {
  const sel = document.getElementById(id);
  return sel ? sel.value : "";
}

/* `heading` is passed only where there is no step question already asking it —
   on the compact profile page. Inside the flow the question is the heading,
   and repeating it under itself is exactly the clutter this screen is for
   removing. */
function renderSolutionQuickPick(v, heading, withName) {
  const a = assumptionOf(v, "solution");
  return `
  <div class="fs-field">
    ${heading ? `<label>${esc(t(heading))}</label>` : ""}
    ${quickPickSelect("qp_solution", INDUSTRY_OPTIONS, a.pick, a.assumption)}
  </div>
  ${withName ? `
  <div class="fs-field">
    <label>${esc(t("Business name"))} <span style="text-transform:none;font-weight:400">${esc(t("(optional)"))}</span></label>
    <input type="text" id="qp_solution_name" value="${esc(v.name || "")}" placeholder="${esc(t("e.g. Aling Nena Karinderya"))}">
  </div>` : ""}
  ${notSureRow(a, "solution")}`;
}
function renderCustomerQuickPick(v, heading) {
  const a = assumptionOf(v, "customer");
  return `
  <div class="fs-field">
    ${heading ? `<label>${esc(t(heading))}</label>` : ""}
    ${quickPickSelect("qp_customer", CUSTOMER_SEGMENT_OPTIONS, a.pick, a.assumption)}
  </div>
  ${notSureRow(a, "customer")}`;
}
function renderProblemQuickPick(v, heading) {
  const a = assumptionOf(v, "problem");
  return `
  <div class="fs-field">
    ${heading ? `<label>${esc(t(heading))}</label>` : ""}
    <div class="fs-startpoint">
      ${PROBLEM_TYPE_OPTIONS.map(([id, category, phrase]) => `
        <button type="button" class="fs-startpoint-card fs-typecard ${a.pick === id ? "is-on" : ""}" data-problemtype="${id}">
          <span class="fs-pill fs-pill-neutral">${esc(t(category))}</span>
          <span class="fs-typecard-phrase">${esc(t(phrase))}</span>
        </button>`).join("")}
    </div>
  </div>
  <div class="fs-field">
    <label>${esc(t("In a few words, what is happening?"))}</label>
    <input type="text" id="qp_problem_detail" value="${esc((a.assumption || "").trim())}" placeholder="${esc(t("e.g. there is nowhere nearby for the workers around here to eat"))}">
  </div>
  ${notSureRow(a, "problem")}`;
}
function bindProblemTypeCards(v) {
  document.querySelectorAll("[data-problemtype]").forEach(btn => btn.addEventListener("click", () => {
    saveOpenQuickPicks(v);
    v.opportunitySnapshot.problem.pick = btn.dataset.problemtype;
    touchVenture(v);
    refresh();
  }));
}
/* Whatever pickers happen to be on screen right now, committed before a
   re-render throws the DOM away. Each save is a no-op when its widget is
   not present. */
function saveOpenQuickPicks(v) {
  saveQuickPick(v, "solution", "qp_solution", INDUSTRY_OPTIONS);
  saveQuickPick(v, "customer", "qp_customer", CUSTOMER_SEGMENT_OPTIONS);
  saveProblemDetail(v);
}
function notSureRow(a, key) {
  return `
  <label class="fs-notsure"><input type="checkbox" data-notsure="${key}" ${a.notSure ? "checked" : ""}> ${esc(t("Not sure yet"))}</label>
  ${a.notSure ? `<p class="fs-notsure-note">${esc(t('Marked "not sure yet" — that is a perfectly good answer for now. Phase 1 and Phase 2 are where this gets developed. You can come back and change it any time.'))}</p>` : ""}`;
}
function bindNotSure(v, key) {
  document.querySelectorAll("[data-notsure]").forEach(box => box.addEventListener("change", () => {
    saveOpenQuickPicks(v);
    const k = box.dataset.notsure;
    v.opportunitySnapshot[k].notSure = box.checked;
    v.opportunitySnapshot[k].lastUpdated = todayISO();
    touchVenture(v);
    refresh();
  }));
}

/* The three Essential Elements, asked once, inside the venture profile.
   They used to live on their own screen at the top of Phase 1; a separate
   screen for three quick taps was one screen too many. */
const ELEMENT_QUESTIONS = {
  problem: "What kind of problem is this?",
  customer: "Who are you selling to?",
  solution: "What kind of business is this?",
};
function saveQuickPick(v, key, id, options) {
  const text = quickPickValue(id, options);
  if (text === null) return;
  const pick = quickPickRawId(id);
  const a = v.opportunitySnapshot[key];
  if (a.pick === pick && a.assumption === text) return;
  a.pick = pick; a.assumption = text; a.lastUpdated = todayISO();
  touchVenture(v);
}
function saveProblemDetail(v) {
  const el = document.getElementById("qp_problem_detail");
  if (!el) return;
  const a = v.opportunitySnapshot.problem;
  const detail = el.value.trim();
  if (a.assumption === detail) return;
  a.assumption = detail; a.lastUpdated = todayISO();
  touchVenture(v);
}
function elementStep(v, key) {
  const step = { id: key, question: ELEMENT_QUESTIONS[key] };
  if (key === "solution") {
    step.body = () => renderSolutionQuickPick(v);
    step.bind = () => { bindQuickPickSelect("qp_solution"); bindNotSure(v, "solution"); };
    step.commit = () => {
      const name = document.getElementById("qp_solution_name")?.value.trim();
      if (name) { v.name = name; touchVenture(v); }
      saveQuickPick(v, "solution", "qp_solution", INDUSTRY_OPTIONS);
    };
  } else if (key === "customer") {
    step.body = () => renderCustomerQuickPick(v);
    step.bind = () => { bindQuickPickSelect("qp_customer"); bindNotSure(v, "customer"); };
    step.commit = () => saveQuickPick(v, "customer", "qp_customer", CUSTOMER_SEGMENT_OPTIONS);
  } else {
    step.body = () => renderProblemQuickPick(v);
    step.bind = () => { bindProblemTypeCards(v); bindNotSure(v, "problem"); };
    step.commit = () => saveProblemDetail(v);
  }
  return step;
}

/* =========================================================================
   RENDER: PHASE 1 — HYPOTHESIS
   ========================================================================= */
function renderHypothesis() {
  const v = getVenture(ROUTE.ventureId);
  const main = document.getElementById("fsMain");
  if (!v) { go("dashboard"); return; }
  /* No admission gate: Phase 1 is always reachable, finished profile or not. */
  const tab = ROUTE.tab || "problem";

  main.innerHTML = `
    <a class="fs-back-link" data-go="profile">&#8592; ${esc(t("%1 profile", v.name || t("Venture")))}</a>
    <p class="fs-eyebrow">${esc(t("Phase 1: Hypothesis"))}</p>
    <h1 class="fs-h1">${esc(t("Turn your starting assumptions into testable hypotheses"))}</h1>
    ${demoFlag(v)}
    ${baseStatementBlock(v, "Everything in this phase sharpens this one sentence.")}
    <div class="fs-tabs">
      <button class="fs-tab ${tab === "problem" ? "is-active" : ""}" data-tab="problem">${esc(t("1. Problem Hypothesis"))}</button>
      <button class="fs-tab ${tab === "segments" ? "is-active" : ""}" data-tab="segments">${esc(t("2. Customer Hypothesis"))}</button>
      <button class="fs-tab ${tab === "solution" ? "is-active" : ""}" data-tab="solution">${esc(t("3. Solution Hypothesis"))}</button>
      <button class="fs-tab ${tab === "gate" ? "is-active" : ""}" data-tab="gate">${esc(t("Decision Gate"))}</button>
    </div>
    <div id="fsHypTabBody"></div>
    <div style="margin-top:26px">${termsGlossary()}</div>
  `;
  main.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => go(el.dataset.go, v.id)));
  main.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", () => go("hypothesis", v.id, el.dataset.tab)));

  const body = document.getElementById("fsHypTabBody");
  if (tab === "problem") body.innerHTML = renderProblemId(v);
  else if (tab === "segments") body.innerHTML = renderSegments(v);
  else if (tab === "solution") body.innerHTML = renderSolutionDiscovery(v);
  else body.innerHTML = renderHypothesisGate(v);
  bindHypothesisTab(v, tab);
}

/* Renders "here is precisely what is missing", not "please write more". */
function coachPanel(gaps, heading) {
  if (!gaps.length) return "";
  return `
  <div class="fs-coach">
    <div class="fs-coach-head">${esc(t(heading))}</div>
    ${gaps.map(g => `
      <div class="fs-coach-item">
        <strong>${esc(g.labelArgs ? t(g.label, ...g.labelArgs) : t(g.label))}</strong>
        ${g.why ? `<p>${esc(t(g.why))}</p>` : ""}
        <span>${esc(t(g.example))}</span>
      </div>`).join("")}
  </div>`;
}

/* --- Step 1: Problem Hypothesis ---
   Cause Exploration deliberately does NOT converge on a root cause. Phase 1
   produces possible explanations; only Phase 2 evidence can promote any of
   them. The absence-of-solution check keeps "nobody sells X here" from
   passing itself off as an explanation of the customer's difficulty. */
/* Four focused steps instead of one page carrying five explanation blocks.
   Text that only restated its own header is gone; the two warnings that
   teach something the user cannot get elsewhere (root cause, and mistaking
   the absence of your solution for a cause) are kept. */
function problemSteps(v) {
  const p = v.hypothesis.problemId;
  return [
    {
      id: "detail",
      question: "How often does this happen, and what does it cost them?",
      example: "Every school day, about 180 households — they stand 20+ minutes and leave straight after.",
      body: () => `
        <div class="fs-example" style="margin-bottom:14px">${esc(t('Your problem assumption: "%1"', assumptionEcho(v, "problem")))}</div>
        ${coachPanel(problemGaps(v), "Make this sharper before you test it")}
        <div class="fs-field">
          <label>${esc(t("How often does this happen?"))}</label>
          <input type="text" id="p_frequency" value="${esc(p.frequency)}" placeholder="${esc(t("e.g. every school day, about 180 households"))}">
        </div>
        <div class="fs-field" style="margin-bottom:0">
          <label>${esc(t("What does it cost them?"))}</label>
          <input type="text" id="p_consequence" value="${esc(p.consequence)}" placeholder="${esc(t("e.g. they stand 20+ minutes and leave straight after"))}">
        </div>`,
      bind: () => {
        document.getElementById("p_frequency")?.addEventListener("blur", e => { if (p.frequency === e.target.value) return; p.frequency = e.target.value; touchVenture(v); refresh(); });
        document.getElementById("p_consequence")?.addEventListener("blur", e => { if (p.consequence === e.target.value) return; p.consequence = e.target.value; touchVenture(v); refresh(); });
      },
      commit: () => {
        const f = document.getElementById("p_frequency"); if (f) p.frequency = f.value;
        const c = document.getElementById("p_consequence"); if (c) p.consequence = c.value;
        touchVenture(v);
      },
    },
    {
      id: "causes",
      question: "What might be causing this?",
      hint: "The last line you write is not automatically the root cause — it is your best guess until evidence says otherwise.",
      body: () => {
        const flagged = absenceFlaggedCauses(v);
        return `
        <div class="fs-suggest-box">
          <div class="fs-suggest-label">${esc(t("Common reasons things get hard — tap one to start a line"))}</div>
          <div class="fs-suggest-actions">${CAUSE_PATTERNS.map(c => `<button data-cause="${c.id}">${esc(t(c.label))}</button>`).join("")}</div>
        </div>
        <div class="fs-field" style="margin-bottom:0">
          ${p.causeExploration.map((w, i) => `<input type="text" class="fs-why" data-i="${i}" value="${esc(w)}" placeholder="${esc(t("Possible cause %1...", i + 1))}" style="margin-bottom:8px">`).join("")}
          ${p.causeExploration.length < 3 ? `<button class="fs-btn fs-btn-ghost fs-btn-sm" id="p_addwhy">${esc(t("+ Explore one level deeper"))}</button>` : ""}
        </div>
        ${flagged.length ? `
        <div class="fs-caution" style="margin-top:16px;margin-bottom:0">
          <strong>${esc(t("That reads like the absence of your solution, not a cause."))}</strong>
          <p>${esc(t('You wrote: "%1"', flagged[0]))}</p>
          <p>${esc(t("Nothing existing yet explains why you could sell something — it does not explain why the situation is difficult for the customer. If no coffee kiosk exists near a school, that still does not tell you why parents are uncomfortable: it could be a lack of seating, no shade, unpredictable dismissal times, access restrictions, or something else entirely."))}</p>
        </div>` : ""}`;
      },
      bind: () => bindProblemCauses(v),
    },
    {
      id: "alternatives",
      question: "What else might explain this situation?",
      hint: "One competing explanation is the cheapest protection against testing only the answer you were hoping for.",
      body: () => {
        const alts = p.alternativeExplanations;
        return `
        <div class="fs-field" style="margin-bottom:0">
          ${alts.map((a, i) => `<input type="text" class="fs-alt" data-i="${i}" value="${esc(a)}" placeholder="${esc(t("Another possible explanation %1...", i + 1))}" style="margin-bottom:8px">`).join("")}
          ${alts.length < 3 ? `<button class="fs-btn fs-btn-ghost fs-btn-sm" id="p_addalt">${esc(t("+ Add another explanation"))}</button>` : ""}
        </div>`;
      },
      bind: () => bindProblemAlternatives(v),
    },
    {
      id: "statement",
      question: "Write it as one testable hypothesis",
      body: () => {
        const draft = generateProblemStatementDraft(v);
        return `
        ${hasLegacyRootCausePhrasing(p.problemStatement) ? `
        <div class="fs-caution">
          <strong>${esc(t("This was written under an earlier version of the framework."))}</strong>
          <p>${esc(t("Your hypothesis below states a root cause as settled. Phase 1 cannot establish a root cause — only Phase 2 evidence can support one."))}</p>
        </div>` : ""}
        ${draft ? suggestBox(draft, `<button id="p_use_sug">${esc(t("Use suggestion"))}</button>`) : ""}
        <div class="fs-field" style="margin-bottom:0">
          <textarea id="p_statement" style="min-height:130px" placeholder="${esc(t("Use the suggestion above, or write your own — phrased as something that could turn out to be wrong."))}">${esc(p.problemStatement)}</textarea>
        </div>`;
      },
      bind: () => {
        document.getElementById("p_statement")?.addEventListener("blur", e => { p.problemStatement = e.target.value; touchVenture(v); });
        document.getElementById("p_use_sug")?.addEventListener("click", () => { p.problemStatement = generateProblemStatementDraft(v); touchVenture(v); refresh(); });
      },
      commit: () => {
        const el = document.getElementById("p_statement"); if (el) p.problemStatement = el.value;
        touchVenture(v);
      },
    },
  ];
}
function renderProblemId(v) {
  return renderStepFlow(v, "problem", problemSteps(v), () => go("hypothesis", v.id, "segments"));
}
function bindProblemCauses(v) {
  const p = v.hypothesis.problemId;
  document.querySelectorAll(".fs-why").forEach(inp => inp.addEventListener("blur", e => {
    const i = +e.target.dataset.i;
    if (p.causeExploration[i] === e.target.value) return;
    p.causeExploration[i] = e.target.value;
    touchVenture(v); refresh();
  }));
  document.querySelectorAll("[data-cause]").forEach(btn => btn.addEventListener("click", () => {
    const pattern = CAUSE_PATTERNS.find(c => c.id === btn.dataset.cause);
    if (!pattern) return;
    const text = causeStarter(v, pattern);
    const slot = p.causeExploration.findIndex(x => !(x || "").trim());
    if (slot >= 0) p.causeExploration[slot] = text;
    else if (p.causeExploration.length < 3) p.causeExploration.push(text);
    else p.causeExploration[p.causeExploration.length - 1] = text;
    touchVenture(v); refresh();
  }));
  document.getElementById("p_addwhy")?.addEventListener("click", () => {
    if (p.causeExploration.length < 3) p.causeExploration.push("");
    touchVenture(v); refresh();
  });
}
function bindProblemAlternatives(v) {
  const p = v.hypothesis.problemId;
  document.querySelectorAll(".fs-alt").forEach(inp => inp.addEventListener("blur", e => {
    const i = +e.target.dataset.i;
    if (p.alternativeExplanations[i] === e.target.value) return;
    p.alternativeExplanations[i] = e.target.value;
    touchVenture(v); refresh();
  }));
  document.getElementById("p_addalt")?.addEventListener("click", () => {
    if (p.alternativeExplanations.length < 3) p.alternativeExplanations.push("");
    touchVenture(v); refresh();
  });
}

/* --- Hypothesis Phase decision gate --- */
function renderHypothesisGate(v) {
  const g = v.hypothesis.decisionGate;
  const problemDone = v.hypothesis.problemId.problemStatement.trim().length > 0;
  const segDone = v.hypothesis.segments.some(s => s.prioritized);
  const compDone = v.hypothesis.competitors.length > 0;
  const driverDone = v.hypothesis.valueDrivers.length > 0;
  const altDone = (v.hypothesis.problemId.alternativeExplanations || []).some(a => (a || "").trim());
  const checklist = [
    [t("A clear, testable Problem Hypothesis is documented"), problemDone],
    [t("At least one competing explanation was considered (recommended)"), altDone],
    [t("At least one priority customer segment is selected"), segDone],
    [t("Current alternatives are recorded"), compDone],
    [t("At least one value-driver hypothesis exists"), driverDone],
  ];
  const allReady = checklist.every(c => c[1]);
  return `
  <div class="fs-card">
    <div class="fs-card-head"><h3>${esc(t("Phase 1 Decision Gate"))}</h3></div>
    <p class="fs-hint">${esc(t("Passing here means three clearly stated, testable hypotheses exist — problem, priority customer, and solution, with the alternatives and value drivers behind them. It does not mean any of them is true. Nothing becomes an insight until Phase 2."))}</p>
    <ul style="padding-left:20px;margin:0 0 18px">
      ${checklist.map(([label, ok]) => `<li style="margin-bottom:6px;color:${ok ? "var(--fs-accent-dark)" : "var(--fs-ink-soft)"}">${ok ? "&#10003;" : "&#9675;"} ${esc(label)}</li>`).join("")}
    </ul>
    <div class="fs-field"><label>${esc(t("Riskiest assumptions to carry into Validation"))}</label><p class="fs-hint" style="margin:2px 0 9px">${esc(t("Which of these three hypotheses would hurt most if it turned out to be wrong? That is what Phase 2 should test first."))}</p><textarea id="g_riskiest">${esc(v.hypothesis.riskiestAssumptions)}</textarea></div>
    <div class="fs-field-row">
      <div class="fs-field"><label>${esc(t("Decision"))}</label><select id="g_decision">${CONFIG.decisions.map(d => `<option value="${esc(d)}" ${g.decision === d ? "selected" : ""}>${esc(tDecision(d))}</option>`).join("")}</select></div>
      <div class="fs-field"><label>${esc(t("Decision date"))}</label><input type="date" id="g_date" value="${esc(g.date)}"></div>
    </div>
    <div class="fs-field"><label>${esc(t("Notes"))}</label><textarea id="g_notes">${esc(g.notes)}</textarea></div>
    ${!allReady ? `<p style="color:var(--fs-warn);font-size:13px;margin:0">${esc(t("A few things above are still open — worth finishing those first, so your decision is based on what you actually found rather than a guess."))}</p>` : `<button class="fs-btn" id="g_save">${esc(t("Save Decision"))}</button>`}
  </div>`;
}

function bindHypothesisTab(v, tab) {
  document.querySelectorAll("[data-hyptab]").forEach(btn => btn.addEventListener("click", () => go("hypothesis", v.id, btn.dataset.hyptab)));
  if (tab === "problem") {
    bindStepFlow(v, "problem", problemSteps(v), () => go("hypothesis", v.id, "segments"));
  } else if (tab === "segments") {
    document.getElementById("seg_add")?.addEventListener("click", () => { v.hypothesis.segments.push(blankSegment()); touchVenture(v); go("hypothesis", v.id, "segments"); });
    document.querySelectorAll("[data-del-seg]").forEach(btn => btn.addEventListener("click", () => { v.hypothesis.segments = v.hypothesis.segments.filter(s => s.id !== btn.dataset.delSeg); touchVenture(v); go("hypothesis", v.id, "segments"); }));
    document.querySelectorAll("[data-use-seg-sug]").forEach(btn => btn.addEventListener("click", () => {
      const seg = v.hypothesis.segments.find(s => s.id === btn.dataset.useSegSug);
      seg.description = generateSegmentDescriptionDraft(seg);
      touchVenture(v);
      go("hypothesis", v.id, "segments");
    }));
    document.querySelectorAll("[data-seg]").forEach(card => {
      const seg = v.hypothesis.segments.find(s => s.id === card.dataset.seg);
      card.querySelectorAll("[data-f]").forEach(inp => {
        const evt = inp.type === "checkbox" ? "change" : "blur";
        inp.addEventListener(evt, () => {
          const path = inp.dataset.f;
          const val = inp.type === "checkbox" ? inp.checked : inp.value;
          seg[path] = val;
          touchVenture(v);
          refresh();
        });
      });
    });
  } else if (tab === "solution") {
    document.getElementById("comp_add")?.addEventListener("click", () => { v.hypothesis.competitors.push(blankCompetitor()); touchVenture(v); go("hypothesis", v.id, "solution"); });
    document.querySelectorAll("[data-add-alt]").forEach(btn => btn.addEventListener("click", () => {
      const a = CONFIG.alternativeStarters.find(x => x.id === btn.dataset.addAlt);
      if (!a) return;
      /* Skip one that is already on the board rather than duplicating it. */
      if (v.hypothesis.competitors.some(c => c.kind === "status-quo" && c.name === t(a.name))) return;
      v.hypothesis.competitors.push(blankCompetitor(t(a.name), t(a.strength), "status-quo"));
      touchVenture(v);
      go("hypothesis", v.id, "solution");
    }));
    document.getElementById("sol_smallest")?.addEventListener("blur", e => {
      if (v.hypothesis.smallestTest === e.target.value) return;
      v.hypothesis.smallestTest = e.target.value;
      touchVenture(v);
      refresh();
    });
    document.querySelectorAll("[data-del-comp]").forEach(btn => btn.addEventListener("click", () => { v.hypothesis.competitors = v.hypothesis.competitors.filter(c => c.id !== btn.dataset.delComp); touchVenture(v); go("hypothesis", v.id, "solution"); }));
    document.querySelectorAll("[data-comp]").forEach(card => {
      const comp = v.hypothesis.competitors.find(c => c.id === card.dataset.comp);
      card.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("blur", () => { if (comp[inp.dataset.f] === inp.value) return; comp[inp.dataset.f] = inp.value; touchVenture(v); refresh(); }));
    });
    document.getElementById("vd_add")?.addEventListener("click", () => { v.hypothesis.valueDrivers.push(blankValueDriver()); touchVenture(v); go("hypothesis", v.id, "solution"); });
    document.querySelectorAll("[data-add-starter]").forEach(btn => btn.addEventListener("click", () => { v.hypothesis.valueDrivers.push(blankValueDriver(btn.dataset.addStarter)); touchVenture(v); go("hypothesis", v.id, "solution"); }));
    document.querySelectorAll("[data-del-driver]").forEach(btn => btn.addEventListener("click", () => { v.hypothesis.valueDrivers = v.hypothesis.valueDrivers.filter(d => d.id !== btn.dataset.delDriver); touchVenture(v); go("hypothesis", v.id, "solution"); }));
    document.querySelectorAll("[data-driver]").forEach(card => {
      const d = v.hypothesis.valueDrivers.find(x => x.id === card.dataset.driver);
      card.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("blur", () => { if (d[inp.dataset.f] === inp.value) return; d[inp.dataset.f] = inp.value; touchVenture(v); refresh(); }));
    });
    document.getElementById("sol_use_sug")?.addEventListener("click", () => { v.hypothesis.solutionHypothesis = generateSolutionHypothesisDraft(v); touchVenture(v); go("hypothesis", v.id, "solution"); });
  } else if (tab === "gate") {
    document.getElementById("g_save")?.addEventListener("click", () => {
      v.hypothesis.riskiestAssumptions = document.getElementById("g_riskiest").value;
      v.hypothesis.decisionGate.decision = document.getElementById("g_decision").value;
      v.hypothesis.decisionGate.date = document.getElementById("g_date").value;
      v.hypothesis.decisionGate.notes = document.getElementById("g_notes").value;
      touchVenture(v);
      /* Name what they finished, rather than confirming a save. */
      toast(t("Phase 1 done — three hypotheses ready to test."));
      go("hypothesis", v.id, "gate");
    });
  }
}

function generateValidationSuggestion(v, key) {
  const h = v.hypothesis;
  const seg = h.segments.find(s => s.prioritized);
  const p = h.problemId;
  if (key === "problem") return p.problemStatement ? t('We believe the problem — "%1" — actually occurs often enough, and matters enough, that people would act to solve it.', p.problemStatement) : "";
  if (key === "customer") return seg ? t('We believe "%1" is a real, reachable customer segment that behaves the way we described: %2.', seg.name, seg.description || seg.need || t("(not yet drafted in Phase 1)")) : "";
  if (key === "solution.competitive") { const c = h.competitors[0]; return c ? t("We believe our approach is meaningfully different from %1 in a way customers actually notice and care about.", c.name || t("the leading alternative")) : ""; }
  if (key === "solution.market") return seg ? t('We believe enough of "%1" exists reachably nearby, relative to current alternatives, to sustain this venture.', seg.name) : "";
  if (key === "solution.product") { const s = v.hypothesis.smallestTest.trim() || v.hypothesis.solutionHypothesis.trim() || assumptionText(v, "solution"); return s ? t("We believe the proposed offer — %1 — will get real purchases, not just polite interest.", s) : ""; }
  if (key === "future.baseline") return t("We believe this venture can cover its costs and be delivered consistently at one location, at the volume we can realistically expect.");
  if (key === "future.growth") { const b = v.validation.futureDirection.baseline.interpretation; return b ? t("Given baseline viability — %1 — we believe this format can replicate to a second location or channel.", b) : ""; }
  return "";
}

function renderValidationGate(v) {
  const g = v.validation.decisionGate;
  const checklist = VALIDATION_KEYS.map(k => [t(VALIDATION_CARD_META[k].title), validationTestComplete(getValidationCard(v, k))]);
  const allReady = checklist.every(c => c[1]);
  const contradictions = VALIDATION_KEYS.filter(k => getValidationCard(v, k).contradictoryResult.trim()).length;
  const unsupported = VALIDATION_KEYS.filter(k => {
    const card = getValidationCard(v, k);
    return card.outcome !== "Not Yet Assessed" && card.outcome !== "Supported";
  });
  return `
  <div class="fs-card">
    <div class="fs-card-head"><h3>${esc(t("Phase 2 Decision Gate"))}</h3></div>
    <p class="fs-hint">${esc(t("A great result in one area can quietly mask a real problem in another — worth a quick look across all four before you decide overall."))}</p>
    <p class="fs-hint" style="margin-top:-6px">${esc(t("Where each Essential Element stands right now:"))}</p>
    ${insightChips(v)}
    ${unsupported.length ? `<div class="fs-caution"><strong>${esc(t(unsupported.length === 1 ? "%1 test did not come back supported." : "%1 tests did not come back supported.", unsupported.length))}</strong>${unsupported.map(k => {
        const card = getValidationCard(v, k);
        return `<p>${esc(card.nextMove
          ? t("%1 — %2, next move: %3. It stays a hypothesis.", t(VALIDATION_CARD_META[k].title), tOutcome(card.outcome), tMove(card.nextMove))
          : t("%1 — %2, no next move chosen yet. It stays a hypothesis.", t(VALIDATION_CARD_META[k].title), tOutcome(card.outcome)))}</p>`;
      }).join("")}</div>` : ""}
    <ul style="padding-left:20px;margin:0 0 18px">
      ${checklist.map(([label, ok]) => `<li style="margin-bottom:6px;color:${ok ? "var(--fs-accent-dark)" : "var(--fs-ink-soft)"}">${ok ? "&#10003;" : "&#9675;"} ${esc(label)}</li>`).join("")}
    </ul>
    ${contradictions ? `<p style="color:var(--fs-warn);font-size:13px;margin:0 0 14px">${esc(t(contradictions === 1 ? "%1 domain logged a contradictory result — review before deciding." : "%1 domains logged a contradictory result — review before deciding.", contradictions))}</p>` : ""}
    <div class="fs-field-row">
      <div class="fs-field"><label>${esc(t("Decision"))}</label><select id="vg_decision">${CONFIG.decisions.map(d => `<option value="${esc(d)}" ${g.decision === d ? "selected" : ""}>${esc(tDecision(d))}</option>`).join("")}</select></div>
      <div class="fs-field"><label>${esc(t("Decision date"))}</label><input type="date" id="vg_date" value="${esc(g.date)}"></div>
    </div>
    <div class="fs-field"><label>${esc(t("Notes"))}</label><textarea id="vg_notes">${esc(g.notes)}</textarea></div>
    ${!allReady ? `<p style="color:var(--fs-warn);font-size:13px;margin:0">${esc(t("A few domains still need an actual result and a decision — once those are in, you will be able to record the overall call here."))}</p>` : `<button class="fs-btn" id="vg_save">${esc(t("Save Decision"))}</button>`}
  </div>`;
}
function bindValidationTab(v, tab) {
  document.querySelectorAll("[data-vexpand]").forEach(el => {
    const activate = () => {
      VAL_EXPANDED[v.id + "." + tab] = el.dataset.vexpand;
      go("validation", v.id, tab);
      document.getElementById("vh_" + el.dataset.vexpand.replace(/\./g, "_"))?.focus();
    };
    el.addEventListener("click", activate);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); activate(); }
    });
  });
  document.querySelectorAll("[data-use-sug]").forEach(btn => btn.addEventListener("click", () => {
    const safeId = btn.dataset.useSug;
    const key = safeId.replace(/_/g, ".");
    const target = getValidationCard(v, key);
    target.hypothesis = generateValidationSuggestion(v, key);
    touchVenture(v);
    go("validation", v.id, tab);
  }));
  document.querySelectorAll("[data-vstep]").forEach(btn => btn.addEventListener("click", () => {
    VAL_STEP[btn.dataset.vstep] = +btn.dataset.step;
    go("validation", v.id, tab);
  }));
  document.querySelectorAll("[data-vcard]").forEach(el => {
    const target = getValidationCard(v, el.dataset.vcard);
    el.querySelectorAll("[data-f]").forEach(inp => {
      const commit = () => {
        if (target[inp.dataset.f] === inp.value) return;
        target[inp.dataset.f] = inp.value;
        touchVenture(v);
        if (inp.dataset.f === "decision" || inp.dataset.f === "outcome" || inp.dataset.f === "metric" || inp.dataset.f === "decisionThreshold") refresh();
      };
      inp.addEventListener("blur", commit);
      if (inp.tagName === "SELECT") inp.addEventListener("change", commit);
    });
  });
  if (tab === "gate") {
    document.getElementById("vg_save")?.addEventListener("click", () => {
      v.validation.decisionGate.decision = document.getElementById("vg_decision").value;
      v.validation.decisionGate.date = document.getElementById("vg_date").value;
      v.validation.decisionGate.notes = document.getElementById("vg_notes").value;
      touchVenture(v);
      toast(t("Phase 2 done — your decision is on the record."));
      go("validation", v.id, "gate");
    });
  }
}

  <div class="fs-card" data-ev="${e.id}">
    <div class="fs-card-head">
      <div style="flex:1"><input type="text" data-f="statement" value="${esc(e.statement)}" placeholder="${esc(t("The statement or claim"))}" style="width:100%;border:none;background:transparent;padding:0;font-size:15px;font-weight:600"></div>
      <div style="display:flex;align-items:center;gap:8px">
        <select data-f="label">${CONFIG.evidenceLabels.map(l => `<option value="${esc(l)}" ${e.label === l ? "selected" : ""}>${esc(tEvidenceLabel(l))}</option>`).join("")}</select>
        <button class="fs-icon-btn" data-del-ev>${esc(t("Delete"))}</button>
      </div>
    </div>
    <div class="fs-field-row-3">
      <div class="fs-field"><label>${esc(t("Source type"))}</label><select data-f="sourceType">${CONFIG.evidenceSourceTypes.map(st => `<option value="${esc(st)}" ${e.sourceType === st ? "selected" : ""}>${esc(t(st))}</option>`).join("")}</select></div>
      <div class="fs-field"><label>${esc(t("Date gathered"))}</label><input type="date" data-f="dateGathered" value="${esc(e.dateGathered)}"></div>
      <div class="fs-field"><label>${esc(t("Validation needed?"))}</label><select data-f="validationNeeded"><option value="Yes" ${e.validationNeeded === "Yes" ? "selected" : ""}>${esc(t("Yes"))}</option><option value="No" ${e.validationNeeded === "No" ? "selected" : ""}>${esc(t("No"))}</option></select></div>
    </div>
    <div class="fs-field"><label>${esc(t("Evidence / source description"))}</label><textarea data-f="sourceDescription">${esc(e.sourceDescription)}</textarea></div>
    <div class="fs-field-row">
      <div class="fs-field"><label>${esc(t("Customer segment"))}</label><input type="text" data-f="segment" value="${esc(e.segment)}"></div>
      <div class="fs-field"><label>${esc(t("Customer occasion"))}</label><input type="text" data-f="occasion" value="${esc(e.occasion)}"></div>
    </div>
    <div class="fs-field"><label>${esc(t("File / link / reference"))}</label><input type="text" data-f="fileLink" value="${esc(e.fileLink)}"></div>
    <div class="fs-field"><label>${esc(t("Contradictory evidence, if any"))}</label><textarea data-f="contradictory">${esc(e.contradictory)}</textarea></div>
    <div class="fs-field"><label>${esc(t("Analyst note"))}</label><textarea data-f="analystNote">${esc(e.analystNote)}</textarea></div>
  </div>`;
}

/* =========================================================================
   MAIN RENDER DISPATCH
   ========================================================================= */
function render() {
  const app = document.querySelector(".fs-app");
  const nav = document.getElementById("fsNav");
  /* The welcome screen takes over the whole shell — no nav, nothing to
     click past it except its own skip link. */
  if (ROUTE.screen === "welcome") {
    app.classList.add("is-welcome");
    nav.style.display = "none";
    renderWelcome();
    saveDB();
    return;
  }
  app.classList.remove("is-welcome");
  nav.style.display = "";
  renderNav();
  const screen = ROUTE.screen;
  if (screen === "dashboard") renderDashboard();
  else if (screen === "profile") renderProfile();
  /* The standalone Essential Elements screen is gone; anything still
     pointing at it lands on the venture profile, where the elements now live. */
  else if (screen === "elements") { ROUTE = { screen: "profile", ventureId: ROUTE.ventureId }; renderNav(); renderProfile(); }
  else if (screen === "hypothesis") renderHypothesis();
  else if (screen === "validation") renderValidation();
  else if (screen === "identity") renderIdentity();
  else if (screen === "evidence") renderEvidence();
  else renderDashboard();
  saveDB();
}

/* The demo exists in both languages. It is seeded in whichever language is

const DEMO_CONTENT = {

function demoContent(lang) { return DEMO_CONTENT[lang] || DEMO_CONTENT.en; }
/* Fingerprints of the pre-v0.2 demo, which asserted a root cause it had no
   evidence for. Only the shipped demo is rewritten — never a user's own
   venture, however similar it looks. */
const STALE_DEMO_MARKERS = [
  "So at the root, the real issue is",
  "the school gate area was never zoned or offered for small vendors before",
];
function isSeededDemo(v) { return /^DEMO — Riverside Coffee Kiosk/.test(v.name || ""); }
function isStaleSeededDemo(v) {
  if (!isSeededDemo(v)) return false;
  const blob = JSON.stringify(v.hypothesis || {});
  return STALE_DEMO_MARKERS.some(m => blob.indexOf(m) !== -1);
}
/* Pristine = still word-for-word one of our seeded versions. Anything the
   user has touched fails this check and is left alone. */
function isPristineDemo(v) {
  if (!isSeededDemo(v) || !v.opportunitySnapshot || !v.hypothesis) return false;
  return Object.keys(DEMO_CONTENT).some(lang => {
    const d = DEMO_CONTENT[lang];
    return v.opportunitySnapshot.problem.assumption === d.problemAssumption
      && v.opportunitySnapshot.customer.assumption === d.customerAssumption
      && v.opportunitySnapshot.solution.assumption === d.solutionAssumption
      && v.hypothesis.problemId.problemStatement === d.problemStatement;
  });
}
function seedDemoVenture(v, lang) {
  const d = demoContent(lang || LANG);
  const fresh = blankVenture();
  v.name = d.name;
  v.owner = d.owner;
  v.mode = "new-venture";
  v.stage = d.stage;
  v.industry = d.industry;
  v.location = d.location;
  v.summary = d.summary;
  v.urgentConstraint = "";
  v.desiredOutcome = "";

  /* The three Essential Elements, stated as assumptions. The demo's answers
     are written out rather than picked from the lists, so they carry no pick
     id — which is exactly what a venture started before the pickers existed
     looks like, and a useful thing for the sample case to exercise. */
  v.startingPoint = "problem";
  v.opportunitySnapshot = {
    problem: { ...blankAssumption(), pick: "need", assumption: d.problemAssumption, lastUpdated: todayISO() },
    customer: { ...blankAssumption(), assumption: d.customerAssumption, lastUpdated: todayISO() },
    solution: { ...blankAssumption(), assumption: d.solutionAssumption, lastUpdated: todayISO() },
  };

  /* Phase 1 output: hypotheses, with no claimed root cause. */
  v.hypothesis = fresh.hypothesis;
  v.hypothesis.problemId.causeExploration = d.causes.slice();
  v.hypothesis.problemId.alternativeExplanations = d.alternatives.slice();
  v.hypothesis.problemId.problemStatement = d.problemStatement;
  v.hypothesis.segments.push({ ...blankSegment(), name: d.segmentName, occasion: d.segmentOccasion, need: d.segmentNeed, prioritized: true, description: d.segmentDescription });
  v.hypothesis.competitors.push({ ...blankCompetitor(), name: d.competitorName, strength: d.competitorStrength, gap: d.competitorGap });
  v.hypothesis.valueDrivers.push({ ...blankValueDriver(d.driverName), category: "Attraction", whyMatters: d.driverWhy });
  v.hypothesis.solutionHypothesis = d.solutionHypothesis;
  v.hypothesis.riskiestAssumptions = d.riskiest;

  /* Nothing validated yet, so nothing here is an insight. */
  v.validation = fresh.validation;
  v.missionVisionValues = fresh.missionVisionValues;

  v.evidence = [{ ...blankEvidence(), statement: d.evidenceStatement, label: "FACT", sourceType: "observation", sourceDescription: d.evidenceSource, contradictory: d.evidenceContradictory, analystNote: d.evidenceNote }];
  /* The demo is a finished worked example — never walk someone through the
     onboarding wizard for a case that is already filled in, and never
     congratulate them for work the sample did. */
  v.profileOnboarded = true;
  v.insightCelebrationShown = insightsSufficientlySupported(v);
  v.updatedAt = todayISO();
  return v;
}

/* ---------------- Init ---------------- */
loadDB();
if (DB.ventures.length === 0 && !DB.settings.sampleRemoved) {
  const demo = blankVenture();
  seedDemoVenture(demo);
  DB.ventures.push(demo);
  saveDB();
}
/* Anyone who has not yet chosen a language — including users who saved data
   before this build existed — gets the welcome screen once. */
if (!DB.settings.onboarded) {
  WELCOME = { lang: DB.settings.lang || null, mode: DB.settings.defaultMode || null };
  ROUTE = { screen: "welcome", ventureId: null, tab: null };
} else if (ownVentures().length === 1) {
  /* One business of your own means the list screen is a detour. Open it. */
  ROUTE = { screen: "profile", ventureId: ownVentures()[0].id, tab: null };
}
render();
</script>
