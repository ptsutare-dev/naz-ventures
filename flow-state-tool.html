<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow State Entrepreneurship &amp; Business Solutions Tool</title>
<meta name="description" content="Structured decision-support and evidence-management tool based on the Flow State Entrepreneurship Framework — the three Essential Elements (Problem, Customer, Solution) developed through Hypothesis, Validation, Positioning, and Execution.">
<link rel="icon" href="assets/logos/naz-ventures-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Naz Ventures / Flow State Studio brand — the tool now reads as the same
     product as the page that introduces it, instead of a cold admin panel. */
  --fs-bg:#faf5ec; --fs-paper:#ffffff; --fs-ink:#2a1810; --fs-ink-soft:#6f5a4a;
  --fs-line:#ecdec8; --fs-line-soft:#f5ebdb;
  --fs-accent:#7a3a1f; --fs-accent-soft:#f8ecd9; --fs-accent-dark:#5c2b16;
  --fs-gold:#e0a030; --fs-gold-soft:#fdf2dc;
  --fs-fact:#416b46; --fs-fact-soft:#e8f0e6;
  --fs-assumption:#a6720f; --fs-assumption-soft:#fdf2dc;
  --fs-inference:#5a5aa6; --fs-inference-soft:#eeeef9;
  --fs-unknown:#8d837b; --fs-unknown-soft:#f2ebe1;
  --fs-warn:#a6402f; --fs-warn-soft:#fae8e2;
  --fs-radius:12px; --fs-radius-sm:8px;
  --fs-shadow:0 1px 2px rgba(42,24,16,.04), 0 6px 20px rgba(42,24,16,.05);
  --fs-shadow-lg:0 16px 44px rgba(42,24,16,.12);
  --fs-display:'Archivo Black','Playfair Display',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--fs-bg);color:var(--fs-ink);font-family:'Poppins',Arial,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0;letter-spacing:-0.01em}
::selection{background:var(--fs-gold-soft)}
a{color:var(--fs-accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ---------- App shell ---------- */
.fs-app{display:flex;min-height:100vh}
.fs-nav{width:248px;flex-shrink:0;background:var(--fs-ink);color:#fff;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.fs-nav-brand{display:flex;align-items:center;gap:10px;padding:0 20px 22px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:18px}
.fs-nav-brand img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff;padding:3px}
.fs-nav-brand div{line-height:1.2}
.fs-nav-brand strong{display:block;font-family:'Playfair Display',serif;font-size:15px}
.fs-nav-brand small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.fs-nav-section{padding:0 14px;margin-bottom:4px}
.fs-nav-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.55;padding:10px 10px 6px}
.fs-nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#fff;padding:10px 10px;border-radius:6px;font-size:13.5px;opacity:.82}
.fs-nav-item:hover{background:rgba(255,255,255,.08);opacity:1}
.fs-nav-item.is-active{background:rgba(224,160,48,.18);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 var(--fs-gold)}
.fs-nav-item.is-active .dot{background:var(--fs-gold);opacity:1}
.fs-nav-item[disabled]{opacity:.35;cursor:not-allowed}
.fs-nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0}
.fs-main{flex:1;min-width:0;padding:40px 48px 96px;max-width:1000px}
@media(max-width:900px){
  .fs-app{flex-direction:column}
  .fs-nav{width:100%;height:auto;position:relative;padding:14px 0;display:block}
  .fs-main{padding:22px 18px 60px}
}

/* ---------- shared bits ---------- */
.fs-eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--fs-accent);margin:0 0 8px}
.fs-h1{font-family:var(--fs-display);font-size:31px;line-height:1.15;letter-spacing:-0.015em;margin-bottom:10px;color:var(--fs-accent-dark)}
@media(max-width:640px){.fs-h1{font-size:25px}}
.fs-lede{color:var(--fs-ink-soft);max-width:660px;margin:0 0 28px;font-size:15px;line-height:1.65}
.fs-card{background:var(--fs-paper);border:1px solid var(--fs-line);border-radius:var(--fs-radius);box-shadow:var(--fs-shadow);padding:26px 28px;margin-bottom:18px}
.fs-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.fs-card-head h3{font-size:18px;color:var(--fs-accent-dark)}
.fs-card .fs-card{box-shadow:none;background:var(--fs-bg)}
.fs-btn{display:inline-flex;align-items:center;gap:7px;background:var(--fs-accent);color:#fff;border:none;box-shadow:0 2px 8px rgba(122,58,31,.22);padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:600;transition:background .15s}
.fs-btn:hover{background:var(--fs-accent-dark);box-shadow:0 4px 14px rgba(122,58,31,.28);transform:translateY(-1px)}
.fs-btn{transition:background .15s,box-shadow .15s,transform .15s}
.fs-btn.fs-btn-ghost{background:transparent;color:var(--fs-accent);border:1.5px solid var(--fs-accent)}
.fs-btn.fs-btn-ghost:hover{background:var(--fs-accent-soft)}
.fs-btn.fs-btn-sm{padding:7px 14px;font-size:12.5px}
.fs-btn.fs-btn-danger{background:transparent;color:var(--fs-warn);border:1.5px solid var(--fs-warn)}
.fs-btn.fs-btn-danger:hover{background:var(--fs-warn-soft)}
.fs-btn[disabled]{opacity:.4;cursor:not-allowed}

.fs-field{margin-bottom:16px}
.fs-field label{display:block;font-size:13.5px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--fs-ink-soft);margin-bottom:6px}
.fs-field input[type="text"],.fs-field input[type="date"],.fs-field input[type="number"],.fs-field select,.fs-field textarea{
  width:100%;border:1.5px solid var(--fs-line);border-radius:var(--fs-radius-sm);padding:12px 14px;color:var(--fs-ink);background:#fff;
  transition:border-color .15s, box-shadow .15s;
}
.fs-field textarea{min-height:84px;resize:vertical;line-height:1.6}
.fs-field input:focus,.fs-field textarea:focus,.fs-field select:focus{outline:none;border-color:var(--fs-accent);box-shadow:0 0 0 3px var(--fs-accent-soft)}
.fs-field input::placeholder,.fs-field textarea::placeholder{color:#b6a493}
.fs-field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fs-field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:640px){.fs-field-row,.fs-field-row-3{grid-template-columns:1fr}}
.fs-hint{font-size:13px;color:var(--fs-ink-soft);margin:-4px 0 14px;line-height:1.6}
.fs-example{background:var(--fs-gold-soft);border:1px dashed #e5cf9f;border-radius:var(--fs-radius-sm);padding:11px 14px;font-size:12.5px;color:var(--fs-ink-soft);margin:-6px 0 14px;font-style:italic}

.fs-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:100px}
.fs-pill-fact{background:var(--fs-fact-soft);color:var(--fs-fact)}
.fs-pill-assumption{background:var(--fs-assumption-soft);color:var(--fs-assumption)}
.fs-pill-inference{background:var(--fs-inference-soft);color:var(--fs-inference)}
.fs-pill-unknown{background:var(--fs-unknown-soft);color:var(--fs-unknown)}
.fs-pill-neutral{background:var(--fs-accent-soft);color:var(--fs-accent-dark)}
.fs-pill-warn{background:var(--fs-warn-soft);color:var(--fs-warn)}

.fs-status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.fs-suggest-box{background:var(--fs-accent-soft);border:1px solid #e6d3b4;border-left:3px solid var(--fs-gold);border-radius:var(--fs-radius-sm);padding:15px 17px;margin-bottom:18px}
.fs-suggest-box .fs-suggest-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fs-accent-dark);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fs-suggest-box p{margin:0 0 10px;font-size:13.5px;line-height:1.55}
.fs-suggest-actions{display:flex;gap:8px;flex-wrap:wrap}
.fs-suggest-actions button{font-size:12px;padding:7px 14px;border-radius:100px;border:1.5px solid #dcc39c;background:#fff;color:var(--fs-accent-dark);font-weight:600;transition:background .15s,border-color .15s,color .15s}
.fs-suggest-actions button:hover{background:var(--fs-accent);color:#fff}

.fs-table-wrap{overflow-x:auto;border:1px solid var(--fs-line);border-radius:6px}
table.fs-table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}
table.fs-table th{background:var(--fs-bg);text-align:left;padding:9px 11px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fs-ink-soft);border-bottom:1px solid var(--fs-line);white-space:nowrap}
table.fs-table td{padding:8px 11px;border-bottom:1px solid var(--fs-line);vertical-align:top}
table.fs-table input,table.fs-table select,table.fs-table textarea{border:1px solid transparent;background:transparent;width:100%;padding:4px 6px;border-radius:4px}
table.fs-table input:focus,table.fs-table select:focus,table.fs-table textarea:focus{border-color:var(--fs-accent);background:#fff;outline:none}
table.fs-table tr:last-child td{border-bottom:none}
.fs-table-actions{display:flex;gap:4px}
.fs-icon-btn{background:none;border:1px solid var(--fs-line);border-radius:5px;padding:5px 8px;font-size:11.5px;color:var(--fs-ink-soft)}
.fs-icon-btn:hover{border-color:var(--fs-warn);color:var(--fs-warn)}

.fs-dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fs-venture-card{background:var(--fs-paper);border:1px solid var(--fs-line);border-radius:var(--fs-radius);box-shadow:var(--fs-shadow);padding:24px;cursor:pointer;transition:border-color .15s, transform .15s, box-shadow .15s}
.fs-venture-card:hover{border-color:var(--fs-gold);transform:translateY(-3px);box-shadow:var(--fs-shadow-lg)}
.fs-venture-card h3{font-size:18px;margin-bottom:4px;color:var(--fs-accent-dark)}
.fs-venture-card .fs-vc-meta{font-size:12px;color:var(--fs-ink-soft);margin-bottom:12px}
.fs-venture-card .fs-vc-stats{display:flex;gap:14px;font-size:11.5px;color:var(--fs-ink-soft);border-top:1px solid var(--fs-line);padding-top:10px;margin-top:2px}
.fs-venture-card .fs-vc-stats b{color:var(--fs-ink);font-weight:700}
.fs-empty{border:1.5px dashed #e0cba6;background:var(--fs-paper);border-radius:var(--fs-radius);padding:48px 26px;text-align:center;color:var(--fs-ink-soft)}
.fs-empty h3{color:var(--fs-ink);margin-bottom:6px;font-size:18px}

.fs-tabs{display:flex;gap:2px;border-bottom:2px solid var(--fs-line);margin-bottom:26px;flex-wrap:wrap}
.fs-tab{background:none;border:none;padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--fs-ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0;transition:color .15s,background .15s}
.fs-tab:hover{color:var(--fs-accent-dark);background:var(--fs-accent-soft)}
.fs-tab.is-active{color:var(--fs-accent-dark);border-bottom-color:var(--fs-gold);font-weight:700}

.fs-elem-card{border-left:3px solid var(--fs-line);padding-left:18px}
.fs-elem-card.is-ready{border-left-color:var(--fs-accent)}
.fs-elem-card.is-drafted{border-left-color:var(--fs-assumption)}

.fs-gate-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--fs-accent-soft);border:1px solid #cfe3e0;border-radius:var(--fs-radius);padding:16px 20px;margin-bottom:24px;flex-wrap:wrap}
.fs-gate-banner.is-locked{background:var(--fs-unknown-soft);border-color:var(--fs-line)}
.fs-gate-banner strong{display:block;font-size:14.5px;margin-bottom:2px}
.fs-gate-banner span{font-size:12.5px;color:var(--fs-ink-soft)}

.fs-back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fs-ink-soft);margin-bottom:14px}
.fs-back-link:hover{color:var(--fs-accent-dark)}

.fs-banner-top{background:var(--fs-accent-dark);color:var(--fs-gold-soft);font-size:12px;text-align:center;padding:8px 14px;letter-spacing:.01em}
.fs-banner-top a{color:#fff;text-decoration:underline}
.fs-toast{position:fixed;bottom:22px;right:22px;background:var(--fs-ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:999}
.fs-toast.show{opacity:1;transform:translateY(0)}

/* ---------- Assumption → Hypothesis → Insight additions ---------- */
.fs-notsure,.fs-field label.fs-notsure{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--fs-ink-soft);text-transform:none;letter-spacing:0;margin:0 0 8px;cursor:pointer}
.fs-notsure input{margin:0;cursor:pointer}
.fs-notsure-note{font-size:12px;color:var(--fs-assumption);background:var(--fs-assumption-soft);border-radius:5px;padding:6px 10px;margin:0 0 10px;line-height:1.5}
.fs-caution{background:var(--fs-warn-soft);border:1px solid #eccdc5;border-left:3px solid var(--fs-warn);border-radius:6px;padding:12px 15px;margin-bottom:16px;font-size:13px;line-height:1.6;color:var(--fs-ink)}
.fs-caution strong{display:block;margin-bottom:4px;color:var(--fs-warn)}
.fs-caution p{margin:0 0 6px}
.fs-caution p:last-child{margin-bottom:0}
.fs-glossary{margin-bottom:20px}
.fs-glossary summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--fs-accent-dark)}
.fs-glossary dl{margin:10px 0 0;padding:14px 16px;background:var(--fs-bg);border:1px solid var(--fs-line);border-radius:var(--fs-radius);font-size:13px;line-height:1.6}
.fs-glossary dt{font-weight:700;color:var(--fs-ink)}
.fs-glossary dd{margin:0 0 9px;padding-left:0;color:var(--fs-ink-soft)}
.fs-glossary dd:last-child{margin-bottom:0}
.fs-ladder{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--fs-unknown);margin:0 0 16px}
.fs-ladder span.is-now{color:var(--fs-accent-dark)}
.fs-ladder i{font-style:normal;opacity:.55}
.fs-insight-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.fs-insight-chip{border:1px solid var(--fs-line);border-radius:100px;padding:6px 14px;font-size:12px;background:var(--fs-paper);color:var(--fs-ink-soft)}
.fs-insight-chip.is-insight{border-color:var(--fs-fact);background:var(--fs-fact-soft);color:var(--fs-fact);font-weight:600}
.fs-demo-flag{background:var(--fs-assumption-soft);border:1px solid #ecd9ae;border-radius:var(--fs-radius);padding:11px 15px;margin-bottom:20px;font-size:12.5px;line-height:1.55;color:#7a5409}
.fs-status-line{display:inline-block;font-size:12px;font-weight:600;color:var(--fs-accent-dark);background:var(--fs-accent-soft);border-radius:100px;padding:4px 12px}
/* ---------- Progress, tally and milestone ---------- */
.fs-journey{margin:0 0 18px}
.fs-journey-bar{height:5px;background:var(--fs-line-soft);border-radius:100px;overflow:hidden}
.fs-journey-bar span{display:block;height:100%;background:var(--fs-gold);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.fs-journey-stages{display:flex;justify-content:space-between;gap:6px;margin-top:7px}
.fs-journey-stages span{font-size:10px;font-weight:600;color:var(--fs-unknown);text-align:center;flex:1;line-height:1.3}
.fs-journey-stages span.is-done{color:var(--fs-fact)}
.fs-journey-stages span.is-now{color:var(--fs-accent-dark);font-weight:700}
@media(max-width:640px){.fs-journey-stages span{font-size:9px}}

.fs-tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px}
@media(max-width:560px){.fs-tally{grid-template-columns:repeat(2,1fr)}}
.fs-tally-cell{border:1px solid var(--fs-line);border-radius:var(--fs-radius-sm);padding:11px 12px;background:var(--fs-paper);text-align:center}
.fs-tally-cell.is-on{border-color:var(--fs-gold);background:var(--fs-gold-soft)}
.fs-tally-cell strong{display:block;font-family:var(--fs-display);font-size:21px;color:var(--fs-unknown);line-height:1.1}
.fs-tally-cell.is-on strong{color:var(--fs-accent-dark)}
.fs-tally-cell span{display:block;font-size:10.5px;color:var(--fs-ink-soft);margin-top:3px;line-height:1.35}

.fs-milestone{background:linear-gradient(180deg,var(--fs-gold-soft),var(--fs-paper));border:1px solid #e5cf9f;border-left:4px solid var(--fs-gold);border-radius:var(--fs-radius);padding:22px 24px;margin-bottom:22px;box-shadow:var(--fs-shadow)}
.fs-milestone-eyebrow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--fs-assumption);margin:0 0 6px}
.fs-milestone h2{font-family:var(--fs-display);font-size:20px;line-height:1.25;color:var(--fs-accent-dark);margin:0 0 8px}
.fs-milestone p{font-size:13.5px;line-height:1.6;color:var(--fs-ink-soft);margin:0 0 14px;max-width:560px}

.fs-card-journey{height:4px;background:var(--fs-line-soft);border-radius:100px;overflow:hidden;margin-top:12px}
.fs-card-journey span{display:block;height:100%;background:var(--fs-gold);border-radius:100px}

/* ---------- Starting-point picker ---------- */
.fs-startpoint{display:flex;flex-direction:column;gap:10px}
.fs-startpoint-card{width:100%;text-align:left;border:1.5px solid var(--fs-line);background:var(--fs-paper);border-radius:var(--fs-radius-sm);padding:16px 18px;font-family:inherit;font-size:15px;font-weight:600;color:var(--fs-ink);transition:border-color .15s,background .15s}
.fs-startpoint-card:hover{border-color:var(--fs-accent)}
.fs-typecard{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.fs-typecard .fs-pill{font-size:11.5px;padding:5px 12px}
.fs-typecard.is-on .fs-pill{background:var(--fs-accent);color:var(--fs-paper)}
.fs-typecard-phrase{font-size:14.5px;font-weight:400;color:var(--fs-ink-soft)}
.fs-typecard.is-on .fs-typecard-phrase{color:var(--fs-accent-dark)}
.fs-element-block{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--fs-line-soft)}
.fs-basestate{background:var(--fs-accent-soft);border:1px solid var(--fs-accent);border-radius:var(--fs-radius);padding:20px 22px;margin-bottom:20px}
.fs-basestate.is-partial{background:var(--fs-bg);border-color:var(--fs-line);border-style:dashed}
.fs-basestate-eyebrow{margin:0 0 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fs-ink-soft)}
.fs-basestate-text{margin:0;font-family:var(--fs-display);font-size:22px;line-height:1.32;letter-spacing:-0.015em;color:var(--fs-accent-dark)}
.fs-basestate-note{margin:11px 0 0;font-size:12.5px;line-height:1.55;color:var(--fs-ink-soft)}
@media(max-width:640px){.fs-basestate{padding:16px 17px}.fs-basestate-text{font-size:19px}}
.fs-startpoint-card.is-on{border-color:var(--fs-accent);background:var(--fs-accent-soft);color:var(--fs-accent-dark)}

/* ---------- Step flow (one focused task per screen) ---------- */
.fs-flow{max-width:640px}
.fs-flow-progress{margin-bottom:20px}
.fs-flow-bar{height:5px;background:var(--fs-line-soft);border-radius:100px;overflow:hidden}
.fs-flow-bar span{display:block;height:100%;background:var(--fs-gold);border-radius:100px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.fs-flow-progress p{margin:7px 0 0;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fs-ink-soft)}
.fs-flow-card{background:var(--fs-paper);border:1px solid var(--fs-line);border-radius:var(--fs-radius);box-shadow:var(--fs-shadow);padding:26px 28px;margin-bottom:18px}
.fs-flow-q{font-family:var(--fs-display);font-size:22px;line-height:1.28;letter-spacing:-0.015em;color:var(--fs-accent-dark);margin:0 0 14px}
.fs-flow-nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:640px){.fs-flow-card{padding:22px 18px}.fs-flow-q{font-size:19px}}

/* ---------- One-question-per-page wizard ---------- */
.fs-wizard{max-width:620px;margin:0 auto;padding:8px 0 40px}
.fs-wizard-skip{display:block;margin:18px auto 0;background:none;border:none;font-size:12.5px;color:var(--fs-ink-soft);text-decoration:underline;cursor:pointer}
.fs-wizard-skip:hover{color:var(--fs-accent)}

.fs-linkbtn{background:none;border:none;padding:0 0 0 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fs-ink-soft);text-decoration:underline}
.fs-linkbtn:hover{color:var(--fs-accent)}
.fs-sample-block{margin-top:34px;padding-top:22px;border-top:1px dashed #e0cba6}
.fs-sample-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.fs-sample-head strong{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fs-ink-soft)}
.fs-sample-head span{display:block;font-size:12.5px;color:var(--fs-ink-soft);max-width:520px;line-height:1.55;margin-top:3px}
.fs-sample-block .fs-venture-card{opacity:.82}
.fs-sample-block .fs-venture-card:hover{opacity:1}
.fs-coverage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
@media(max-width:560px){.fs-coverage{grid-template-columns:1fr}}
.fs-coverage-cell{border:1.5px dashed #e0cba6;border-radius:var(--fs-radius-sm);padding:10px 12px;background:var(--fs-bg)}
.fs-coverage-cell.is-on{border-style:solid;border-color:var(--fs-fact);background:var(--fs-fact-soft)}
.fs-coverage-cell strong{display:block;font-size:12.5px;color:var(--fs-ink)}
.fs-coverage-cell span{font-size:11.5px;color:var(--fs-ink-soft)}
.fs-coverage-cell.is-on span{color:var(--fs-fact);font-weight:600}
.fs-coach{background:var(--fs-assumption-soft);border:1px solid #ecd9ae;border-left:3px solid var(--fs-assumption);border-radius:6px;padding:14px 16px;margin-bottom:18px}
.fs-coach-head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a5409;margin-bottom:10px}
.fs-coach-item{margin-bottom:11px}
.fs-coach-item:last-child{margin-bottom:0}
.fs-coach-item strong{display:block;font-size:13.5px;color:var(--fs-ink);margin-bottom:2px}
.fs-coach-item p{margin:0 0 3px;font-size:12.5px;line-height:1.55;color:var(--fs-ink-soft)}
.fs-coach-item span{display:block;font-size:12.5px;line-height:1.55;color:#7a5409;font-style:italic}
.fs-segmented{display:flex;gap:6px;flex-wrap:wrap}
.fs-segment{flex:1;min-width:150px;border:1.5px solid var(--fs-line);background:var(--fs-paper);color:var(--fs-ink-soft);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;text-align:left}
.fs-segment:hover{border-color:var(--fs-accent)}
.fs-segment.is-on{border-color:var(--fs-accent);background:var(--fs-accent-soft);color:var(--fs-accent-dark)}

/* ---------- Language + starting-point welcome screen ---------- */
.fs-app.is-welcome .fs-main{max-width:none;display:flex;align-items:center;justify-content:center;padding:36px 20px 60px}
.fs-welcome{max-width:640px;width:100%}
.fs-welcome-card{background:var(--fs-paper);border:1px solid var(--fs-line);border-radius:18px;padding:38px 40px;box-shadow:var(--fs-shadow-lg)}
.fs-welcome-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.fs-welcome-brand img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;padding:3px;border:1px solid var(--fs-line)}
.fs-welcome-brand strong{display:block;font-family:'Playfair Display',serif;font-size:17px}
.fs-welcome-brand small{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--fs-ink-soft)}
.fs-welcome h1{font-family:var(--fs-display);font-size:27px;margin-bottom:10px;line-height:1.18;letter-spacing:-0.015em;color:var(--fs-accent-dark)}
.fs-welcome-lede{color:var(--fs-ink-soft);font-size:14px;margin:0 0 4px;line-height:1.6}
.fs-welcome-q{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fs-accent);margin:24px 0 10px}
.fs-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fs-choice{border:1.5px solid var(--fs-line);background:var(--fs-paper);border-radius:10px;padding:15px 16px;text-align:left;transition:border-color .15s,background .15s}
.fs-choice:hover{border-color:var(--fs-accent)}
.fs-choice.is-on{border-color:var(--fs-accent);background:var(--fs-accent-soft)}
.fs-choice strong{display:block;font-size:14.5px;margin-bottom:3px;color:var(--fs-ink);font-family:'Poppins',Arial,sans-serif;font-weight:700}
.fs-choice span{display:block;font-size:12.5px;color:var(--fs-ink-soft);line-height:1.5}
.fs-welcome-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px;flex-wrap:wrap}
.fs-welcome-skip{background:none;border:none;color:var(--fs-ink-soft);font-size:12.5px;font-weight:600;text-decoration:underline;padding:0}
.fs-welcome-skip:hover{color:var(--fs-accent-dark)}
.fs-welcome-foot{text-align:center;font-size:11.5px;color:var(--fs-ink-soft);margin-top:18px}
.fs-lang-switch{display:flex;gap:4px;padding:6px 10px 0}
.fs-lang-switch button{flex:1;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:10.5px;font-weight:600;padding:6px 4px;border-radius:5px;opacity:.65}
.fs-lang-switch button:hover{opacity:.9}
.fs-lang-switch button.is-on{background:rgba(255,255,255,.26);opacity:1}
@media(max-width:560px){.fs-choice-grid{grid-template-columns:1fr}.fs-welcome-card{padding:26px 22px}.fs-welcome h1{font-size:22px}}

<script>
/* =========================================================================
   FLOW STATE ENTREPRENEURSHIP & BUSINESS SOLUTIONS TOOL — MVP v0.2

   The three Essential Elements — Problem, Customer, Solution — are the
   permanent conceptual foundation of the framework, not a phase and not a
   standalone workflow. They are developed across Phase 1 and Phase 2 along
   a single strict progression:

       Assumption  →  Hypothesis  →  Insight

   • Assumption: the user's best starting answer, not yet examined.
     Captured in the venture profile, before Phase 1 begins.
   • Hypothesis: a clearer, testable proposition. Phase 1's output.
   • Insight: an understanding real evidence sufficiently supports.
     Only earned in Phase 2, and only on a "Supported" outcome.

   Nothing is ever promoted up that ladder automatically, and no generated
   text may describe an unvalidated item as a fact, a root cause, or an
   insight. Suggested drafts stay labelled and editable throughout.

   Deferred to a later iteration: Phase 3 Positioning, Phase 4 Execution,
   Consultant Outcome Documentation, the full report suite, and the
   framework-configuration admin area.
   ========================================================================= */

const FRAMEWORK_VERSION = "MVP v0.2";
const FRAMEWORK_UPDATED = "2026-08-24";
const STORE_KEY = "flow-state-tool-v1";
const SCHEMA_VERSION = 2;

/* ---------------- Framework configuration (editable in one place, per
   the build prompt's requirement that names/labels stay reconfigurable
   without rebuilding the app) ---------------- */
const CONFIG = {
  phases: [
    { id: "hypothesis", label: "Phase 1: Hypothesis", short: "Hypothesis" },
    { id: "validation", label: "Phase 2: Validation", short: "Validation" },
    { id: "positioning", label: "Phase 3: Positioning", short: "Positioning" },
    { id: "execution", label: "Phase 4: Execution", short: "Execution" },
  ],
  ventureModes: [
    { id: "new-venture", label: "New venture / pre-opening" },
    { id: "existing-business", label: "Existing business / audit" },
    { id: "consultant-case", label: "Consultant workspace" },
  ],
  evidenceLabels: ["FACT", "ASSUMPTION", "INFERENCE", "UNKNOWN"],
  evidenceSourceTypes: ["observation", "interview", "transaction", "experiment", "document", "operating data", "third-party research", "other"],
  decisions: ["Not Yet Assessed", "Proceed", "Revise", "Test Further", "Stop"],
  /* Phase 2 classifies how well the evidence actually backs the hypothesis.
     Only "Supported" earns the word "Insight". */
  validationOutcomes: ["Not Yet Assessed", "Supported", "Partially supported", "Not supported", "Inconclusive"],
  /* What to do with a hypothesis the evidence did not sufficiently support. */
  nextMoves: ["", "Refine", "Retest", "Replace", "Reject"],
  ventureStatuses: ["Starting statement not written", "Starting statement in progress", "Hypotheses in development", "Ready for validation", "Validation in progress", "Insights sufficiently supported"],
  valueDriverCategories: ["Attraction", "Conversion", "Retention"],
  /* The alternatives that actually beat most new ventures are not shops.
     They are inertia, self-service and substitution — so the tool seeds
     those by name rather than waiting for the user to think of them. */

    { id: "nothing", name: "Doing nothing / putting up with it", strength: "Costs nothing, needs no decision, and never disappoints them." },

    { id: "further", name: "Going somewhere further away", strength: "Known, trusted, and already part of another trip they make." },

    { id: "substitute", name: "A rough substitute", strength: "Not ideal, but good enough that the problem stops being urgent." },
  ],
  starterValueDrivers: ["Accessibility/convenience", "Affordability", "Ambience/aesthetics/design", "Hospitality", "Product/service quality", "Experiences/community"],
};

/* =========================================================================
   LANGUAGE
   The tool ships in English and Filipino. Translation keys ARE the English
   source strings, so an untranslated string degrades to readable English
   instead of showing a raw key. t() also does %1/%2 interpolation.
   ========================================================================= */
const LANGS = [
  { id: "en", label: "English", note: "The tool, prompts and examples in English." },
  { id: "fil", label: "Filipino", note: "Ang buong tool, mga tanong at halimbawa sa Filipino." },
];
let LANG = "en";
function t(en, ...args) {
  let s = (LANG !== "en" && DICT[LANG] && DICT[LANG][en]) ? DICT[LANG][en] : en;
  for (let i = 0; i < args.length; i++) s = s.split("%" + (i + 1)).join(args[i]);
  return s;
}
/* Values persisted in venture records stay in English forever — only their
   presentation is translated, so switching language never rewrites data. */
function tEvidenceLabel(l) { return t("evidence-label:" + l); }
function tDecision(d) { return t("decision:" + d); }
function tOutcome(o) { return t("outcome:" + o); }
function tMove(m) { return m ? t("move:" + m) : ""; }
function tMode(id) { const m = CONFIG.ventureModes.find(x => x.id === id); return m ? t(m.label) : id; }
function setLanguage(lang, opts) {
  if (!LANGS.some(l => l.id === lang)) return;
  LANG = lang;
  DB.settings.lang = lang;
  /* The bundled demo is ours, so it follows the language — but only while it
     is still untouched. The moment a user edits it, it is their data. */
  if (!opts || opts.reseedDemo !== false) {
    DB.ventures.forEach(v => { if (isPristineDemo(v)) seedDemoVenture(v); });
  }
  saveDB();
}

/* =========================================================================
   PROFILE SIGN-IN SHEET
   Same mechanism the Coffee Cart pages already use: a hidden form POST into
   a Google Form, which lands in a Sheet. No server, no CORS, no library.

   What gets sent: who they are and what they are working on. What never
   gets sent: their venture content — the problem, customer, competitors,
   evidence and numbers. That stays on their device. Sending someone's
   business plan to a spreadsheet is a different promise entirely, and not
   one this tool makes.

   Until PROFILE_SHEET.url and the entry IDs are filled in, this is inert
   and the interface says nothing is sent. Paste the real values in and it
   starts working, and the wording changes to match.
   ========================================================================= */
const PROFILE_SHEET = {
  url: "https://docs.google.com/forms/d/e/1FAIpQLSdWxvnqhWfJRkSf42sEJAS6LNOtJUEn4OjLq8yBuoX4JPxNsA/formResponse",
  fields: {
    name: "entry.2030211007",          // What should we call you?
    business: "entry.1580395550",      // What are you working on?
    startingPoint: "entry.665870054",  // New business / existing business / consultant
    language: "entry.75753303",        // English or Filipino
    startedAt: "entry.381378831",      // Date they first opened the tool
  },
};
function profileSheetReady() {
  return !!PROFILE_SHEET.url && !!PROFILE_SHEET.fields.name;
}
/* Fire and forget, exactly like the Coffee Cart checkout. */
function submitToGoogleForm(action, entries) {
  const iframeName = "gform_" + Date.now();
  const iframe = document.createElement("iframe");
  iframe.name = iframeName;
  iframe.style.display = "none";
  document.body.appendChild(iframe);

  const form = document.createElement("form");
  form.method = "POST";
  form.action = action;
  form.target = iframeName;
  form.style.display = "none";

  Object.keys(entries).forEach((key) => {
    if (!key) return;
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = entries[key] == null ? "" : String(entries[key]);
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  setTimeout(() => { form.remove(); iframe.remove(); }, 5000);
}
/* Sent once, when they finish the welcome screen. Never re-sent on every
   visit — the sheet is a record of who started, not a usage log. */
function recordProfile() {
  if (!profileSheetReady()) return;
  if (DB.settings.profileSent) return;
  const modeLabel = (CONFIG.ventureModes.find(m => m.id === DB.settings.defaultMode) || {}).label || DB.settings.defaultMode || "";
  const f = PROFILE_SHEET.fields;
  const entries = {};
  entries[f.name] = DB.settings.userName || "";
  entries[f.business] = DB.settings.startingBusiness || "";
  entries[f.startingPoint] = modeLabel;
  entries[f.language] = DB.settings.lang === "fil" ? "Filipino" : "English";
  entries[f.startedAt] = todayISO();
  try {
    submitToGoogleForm(PROFILE_SHEET.url, entries);
    DB.settings.profileSent = true;
    saveDB();
  } catch (e) {
    /* A failed send must never block someone from using the tool. */
    console.warn("Flow State: could not record profile", e);
  }
}

let DB = { ventures: [], settings: { lang: null, defaultMode: null, onboarded: false, userName: "" } };
function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) DB = JSON.parse(raw);
  } catch (e) { console.warn("Flow State: could not load saved data", e); }
  if (!Array.isArray(DB.ventures)) DB.ventures = [];
  /* Settings arrived with the bilingual build; records saved before it have
     none, and are treated as not-yet-onboarded. */
  if (!DB.settings) DB.settings = { lang: null, defaultMode: null, onboarded: false };
  if (typeof DB.settings.userName !== "string") DB.settings.userName = "";
  if (DB.settings.lang && LANGS.some(l => l.id === DB.settings.lang)) LANG = DB.settings.lang;
  DB.ventures.forEach(migrateVenture);
}
/* Legacy Essential Element -> starting assumption. The old
   "firstDraft" was the user's first statement of the element, which is
   exactly an assumption; any other notes they had typed are carried along
   rather than dropped. */
function migrateAssumption(old) {
  const a = blankAssumption();
  if (!old || typeof old !== "object") return a;
  a.assumption = String(old.assumption != null ? old.assumption : (old.firstDraft || ""));
  a.notSure = !!old.notSure;
  a.lastUpdated = old.lastUpdated || null;
  ["evidenceLabel", "supports", "contradicts", "riskiestAssumption", "unknowns", "validationNeeded", "revisedDraft"].forEach(k => {
    if (old[k]) a[k] = old[k];
  });
  return a;
}
/* Records saved before Phase 2 had an outcome classification only carried a
   Proceed/Revise/Test Further/Stop decision. Read the nearest honest outcome
   out of it so existing ventures keep their progress — never upgrade an
   unassessed test into "Supported". */
const LEGACY_DECISION_TO_OUTCOME = {
  "Proceed": "Supported",
  "Revise": "Partially supported",
  "Test Further": "Inconclusive",
  "Stop": "Not supported",
};
function migrateVenture(v) {
  if (!v.validation) {
    v.validation = {
      problem: blankValidationTest(), customer: blankValidationTest(),
      solution: { competitiveAnalysis: blankValidationTest(), market: blankValidationTest(), product: blankValidationTest() },
      futureDirection: { baseline: blankValidationTest(), growth: blankValidationTest() },
      decisionGate: { decision: "Not Yet Assessed", date: "", notes: "" },
    };
  }
  if (!v.missionVisionValues) v.missionVisionValues = { mission: "", vision: "", coreValues: [] };
  if (!v.hypothesis) v.hypothesis = blankVenture().hypothesis;
  if (!v.evidence) v.evidence = [];
  if (!v.existingIntake) v.existingIntake = blankVenture().existingIntake;

  /* Schema v2 — the standalone Essential Elements workflow folded into the
     venture profile. Values move across; nothing is discarded. */
  if (!v.opportunitySnapshot) {
    const old = v.essentialElements || {};
    v.opportunitySnapshot = {
      problem: migrateAssumption(old.problem),
      customer: migrateAssumption(old.customer),
      solution: migrateAssumption(old.solution),
    };
  }
  ["problem", "customer", "solution"].forEach(k => {
    if (!v.opportunitySnapshot[k]) v.opportunitySnapshot[k] = blankAssumption();
  });
  delete v.essentialElements;
  delete v.admissionGatePassed;
  delete v.ventureHypothesis;

  /* Phase 1 problem work: the "why chain" is now Cause Exploration, and it
     no longer terminates in a claimed root cause — competing explanations
     sit beside it. */
  const pid = v.hypothesis.problemId || (v.hypothesis.problemId = { causeExploration: [""], alternativeExplanations: [""], problemStatement: "" });
  if (!Array.isArray(pid.causeExploration) || !pid.causeExploration.length) {
    pid.causeExploration = (Array.isArray(pid.whyChain) && pid.whyChain.length) ? pid.whyChain.slice() : [""];
  }
  delete pid.whyChain;
  if (!Array.isArray(pid.alternativeExplanations) || !pid.alternativeExplanations.length) pid.alternativeExplanations = [""];
  if (typeof pid.frequency !== "string") pid.frequency = "";
  if (typeof pid.consequence !== "string") pid.consequence = "";
  if (typeof pid.problemStatement !== "string") pid.problemStatement = "";
  if (typeof v.hypothesis.smallestTest !== "string") v.hypothesis.smallestTest = "";
  (v.hypothesis.competitors || []).forEach(c => {
    if (typeof c.whyStay !== "string") c.whyStay = "";
    if (typeof c.kind !== "string") c.kind = "";
  });
  (v.hypothesis.valueDrivers || []).forEach(d => { if (typeof d.beats !== "string") d.beats = ""; });

  /* Phase 2 outcome classification. */
  VALIDATION_KEYS.forEach(k => {
    const c = getValidationCard(v, k);
    if (!c) return;
    if (c.outcome === undefined) c.outcome = LEGACY_DECISION_TO_OUTCOME[c.decision] || "Not Yet Assessed";
    if (c.nextMove === undefined) c.nextMove = "";
  });

  /* Anyone who already has real profile content came through the old
     single-page form — never make them repeat that as a wizard. Only a
     genuinely untouched venture gets the new guided flow. */
  if (typeof v.profileOnboarded !== "boolean") {
    v.profileOnboarded = !!(v.name || v.urgentConstraint || v.desiredOutcome);
  }
  if (typeof v.startingPoint !== "string") v.startingPoint = "";
  ["problem", "customer", "solution"].forEach(k => {
    if (typeof v.opportunitySnapshot[k].pick !== "string") v.opportunitySnapshot[k].pick = "";
  });
  /* Don't retroactively "celebrate" work that finished before this existed. */
  if (typeof v.insightCelebrationShown !== "boolean") {
    v.insightCelebrationShown = insightsSufficientlySupported(v);
  }

  /* The shipped demo is ours to correct; a user's own ventures are not. */
  if (isStaleSeededDemo(v)) seedDemoVenture(v);
  v.schemaVersion = SCHEMA_VERSION;
}
function saveDB() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    const el = document.getElementById("fsSaveState");
    if (el) { el.textContent = t("Saved %1", new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })); }
  } catch (e) { console.warn("Flow State: could not save", e); }
}

/* ---------------- Backup / restore ----------------
   The only copy of anyone's work is this browser's storage — there is no
   account and no server. This is the safety net for that: save everything
   to a file, or load one back in. Deliberately not surfaced as a button on
   the main screen — that reads as a technical word ("JSON") to someone with
   no reason to know what it means, and creates friction on the one screen
   that most needs to stay simple. It lives in the sidebar footer instead,
   reachable by anyone who goes looking (support walking someone through a
   phone change, Patrick debugging a report) without being a prompt aimed at
   a first-time visitor. */
function downloadBackup() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "flow-state-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function restoreFromBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    /* A raw JSON.parse error ("Unexpected token...") is exactly the kind of
       thing this tool exists to keep away from someone with no technical
       background — never surface it directly. */
    let data;
    try { data = JSON.parse(reader.result); }
    catch (err) { alert(t("This does not look like a Flow State backup file.")); return; }
    if (!data || !Array.isArray(data.ventures)) { alert(t("This does not look like a Flow State backup file.")); return; }
    const keepSettings = DB.settings;
    DB = data;
    /* A backup carries ventures, not preferences — keep the language and
       name this browser already has. */
    DB.settings = keepSettings;
    DB.ventures.forEach(migrateVenture);
    saveDB();
    toast(t("Restored %1 case(s).", data.ventures.length));
    go("dashboard");
  };
  reader.readAsText(file);
}

/* ---------------- Router ---------------- */
let ROUTE = { screen: "dashboard", ventureId: null, tab: null };
function sameView(a, b) {
  return a.screen === b.screen && a.ventureId === b.ventureId && a.tab === b.tab;
}
/* Where the caret was, expressed as a selector that survives a re-render. */
function focusSignature(el) {
  if (!el || el === document.body || !el.tagName) return null;
  const q = (s) => (window.CSS && CSS.escape) ? CSS.escape(s) : s;
  if (el.id) return "#" + q(el.id);
  const own = ["data-el", "data-notsure", "data-f"].filter(a => el.hasAttribute(a))
    .map(a => `[${a}="${q(el.getAttribute(a))}"]`).join("");
  /* Cause / alternative inputs are identified by class + index, not data-f. */
  const indexed = el.classList.contains("fs-why") || el.classList.contains("fs-alt");
  if (!own && !indexed) return null;
  /* data-f repeats across cards, so scope it to the card it lives in. */
  const owners = ["data-seg", "data-comp", "data-driver", "data-vcard", "data-ev", "data-cv"];
  const card = el.closest(owners.map(a => `[${a}]`).join(","));
  let prefix = "";
  if (card) {
    const a = owners.find(x => card.hasAttribute(x));
    if (a) prefix = `[${a}="${q(card.getAttribute(a))}"] `;
  }
  let cls = "";
  if (el.classList.contains("fs-why")) cls = ".fs-why";
  else if (el.classList.contains("fs-alt")) cls = ".fs-alt";
  const idx = el.hasAttribute("data-i") ? `[data-i="${q(el.getAttribute("data-i"))}"]` : "";
  return prefix + cls + idx + own;
}
function restoreFocus(sig, sel) {
  if (!sig) return;
  const el = document.querySelector(sig);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (sel && el.setSelectionRange) {
    try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ }
  }
}
function go(screen, ventureId, tab) {
  const next = { screen, ventureId: ventureId || null, tab: tab || null };
  const inPlace = sameView(ROUTE, next);
  const y = window.scrollY;
  const sig = inPlace ? focusSignature(document.activeElement) : null;
  const el = document.activeElement;
  const sel = (inPlace && el && el.setSelectionRange) ? [el.selectionStart, el.selectionEnd] : null;
  ROUTE = next;
  render();
  if (inPlace) {
    /* Re-rendering the screen you are already on must not throw you back to
       the top or lose your place mid-sentence. */
    window.scrollTo({ top: y });
    restoreFocus(sig, sel);
  } else {
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
}
/* A blur handler that re-renders immediately destroys the element the user is
   in the middle of clicking, so the click never lands and they have to click
   twice. Deferring by a tick lets the click finish first. */
let REFRESH_QUEUED = false;
function refresh() {
  if (REFRESH_QUEUED) return;
  REFRESH_QUEUED = true;
  setTimeout(() => {
    REFRESH_QUEUED = false;
    go(ROUTE.screen, ROUTE.ventureId, ROUTE.tab);
  }, 0);
}

/* ---------------- Evidence counting / gate logic ---------------- */
function evidenceCounts(v) {
  const counts = { FACT: 0, ASSUMPTION: 0, INFERENCE: 0, UNKNOWN: 0, contradictions: 0 };

/* ---------------- Essential Elements: the three starting assumptions ----- */
const ELEMENT_KEYS = ["problem", "customer", "solution"];

/* "Not sure yet" counts as an answer — uncertainty is acceptable here, not
   an error state, and it must never block progress. */
function assumptionAnswered(v, key) {
  const a = assumptionOf(v, key);

}

/* Reading an assumption back to the user elsewhere in the tool. Never

function assumptionEcho(v, key) {

  if (assumptionOf(v, key).notSure) return t("Not sure yet — you marked this one to come back to.");

/* ---------------- The base statement ----------------
   One plain sentence assembled from the three quick answers: who it is for,
   what they want, and which of the three shapes the want takes. It is meant
   to be the most generic version of the opportunity, not a finding — it is
   the foundation Phase 1 sharpens into hypotheses that can actually be
   tested.

   The verb comes from the problem category, which is the whole reason the
   categories are asked as categories: "I don't want this anymore" becomes
   "want to get rid of", "I need this" becomes "need", "I want this" becomes
   "want". A pain point points at the difficulty itself; a need or a gap
   points at the thing that would answer it. */

  const blank = "__________";

/* ---------------- Cause exploration safeguards ---------------- */
/* A proposed cause phrased as "there is no <the thing I want to build>" is
   not an explanation of the customer's difficulty — it is a restatement of
   the solution assumption. Flag it, in English or Filipino, rather than
   letting it graduate into a problem hypothesis unchallenged. */
const ABSENCE_PATTERNS = [
  /\bno\s+\w/i, /\bnone\b/i, /\bnothing\b/i, /\bnot\s+any\b/i, /\bisn'?t\s+(a|an|any)\b/i,
  /\baren'?t\s+any\b/i, /\bdoes\s*n'?o?t\s+exist\b/i, /\bdon'?t\s+exist\b/i,
  /\black(s|ing)?\s+of\b/i, /\babsence\s+of\b/i, /\bmissing\b/i, /\bnever\s+been\b/i,
  /\bwala(ng)?\b/i, /\bkulang\b/i, /\bhindi\s+available\b/i,

  return assumptionText(v, "solution").toLowerCase().replace(/[^a-z0-9\u00f1\s]/gi, " ").split(/\s+/)
    .filter(w => w.length > 3 && !CAUSE_STOPWORDS.has(w));

  const kws = solutionKeywords(v);
  if (!kws.length) return false;
  const lower = s.toLowerCase();
  return kws.some(w => lower.indexOf(w) !== -1);
}

    .filter(c => c && looksLikeAbsenceOfSolution(v, c));

/* Statements written under the pre-v0.2 framework asserted a root cause.
   We never rewrite what a user typed — we just point it out and leave the
   decision to them. */
const LEGACY_ROOTCAUSE_PATTERNS = [/so at the root,? the real issue is/i, /the actual cause is/i, /this is happening because/i, /digging deeper:/i];

  return LEGACY_ROOTCAUSE_PATTERNS.some(re => re.test(text || ""));

/* =========================================================================

   causes drawn from the ways situations actually get hard for customers.

/* A subject this broad cannot be found, counted, or interviewed. */
const VAGUE_SUBJECTS = [
  /\beveryone\b/i, /\bpeople\b/i, /\banyone\b/i, /\bthe public\b/i, /\bcustomers?\b/i,
  /\bmga tao\b/i, /\blahat\b/i, /\bkahit sino\b/i, /\btaga-?rito\b/i,

  /\d/,

  /\b(kaya|dahil dito|napipilitan|nasasayang|natatagalan|tumitigil|sumusuko|hindi na)\b/i,

];

/* What is missing from the problem picture, in the order worth fixing. */
function problemGaps(v) {
  const pid = v.hypothesis.problemId;
  const problem = assumptionText(v, "problem");
  const customer = assumptionText(v, "customer");
  const gaps = [];
  if (!problem) {
    gaps.push({ id: "problem", label: "What the difficulty actually is", why: "Nothing to sharpen yet — write a problem assumption in the venture profile first.", example: "Parents waiting at pickup have nowhere comfortable to stand." });
  }
  if (!customer || hits(VAGUE_SUBJECTS, customer) || wordCount(customer) < 3) {
    gaps.push({ id: "who", label: "Who exactly", why: "A group this broad cannot be found, counted, or interviewed — and Phase 2 will need to do all three.", example: "Parents and yayas doing the 3pm pickup at one specific school — not \"customers\"." });
  }
  if (!pid.frequency.trim() && !hits(TIME_MARKERS, problem)) {
    gaps.push({ id: "when", label: "How often, and when", why: "A difficulty that happens twice a year is a different business from one that happens daily.", example: "Every school day, roughly 3:00–4:00pm, about 180 households." });
  }
  if (!pid.consequence.trim() && !hits(CONSEQUENCE_MARKERS, problem)) {
    gaps.push({ id: "cost", label: "What it costs them", why: "A problem with no consequence is an annoyance, and people do not pay to remove annoyances.", example: "They stand for 20+ minutes in the heat, so they leave straight after and buy nothing nearby." });
  }

}
function customerGaps(v) {

  const gaps = [];
  if (!customer) return gaps;
  if (hits(VAGUE_SUBJECTS, customer) || wordCount(customer) < 3) {
    gaps.push({ id: "narrow", label: "Narrow it to a group you could stand in front of", example: "\"Parents and yayas on the 3pm pickup run\" beats \"parents\"." });
  }
  if (!hits(TIME_MARKERS, customer) && !hits(PLACE_MARKERS, customer)) {
    gaps.push({ id: "occasion", label: "Add the occasion or the place", example: "Same person behaves differently on a school run than on a weekend errand." });
  }

/* Candidate explanations for why a situation is hard, drawn from the ways

   want to sell does not exist yet" — that restates the solution and explains
   nothing, which is exactly the trap the framework warns about. */
const CAUSE_PATTERNS = [
  { id: "access",  label: "Distance or access",      starter: "Reaching the nearest option takes more time or effort than %1 can spare." },
  { id: "timing",  label: "Timing",                  starter: "The moment %1 need this does not line up with when the options are actually open." },
  { id: "cost",    label: "Cost",                    starter: "The options that exist cost more than %1 judge the result to be worth." },
  { id: "hassle",  label: "Too much hassle",         starter: "The current way takes too many steps for %1 to go through every time." },
  { id: "supply",  label: "Runs out or unavailable", starter: "What %1 need has run out, or is not offered at the moment they need it." },
  { id: "comfort", label: "The place itself",        starter: "Where %1 have to wait or stand is uncomfortable — seating, heat, noise, or shelter." },
  { id: "info",    label: "They do not know",        starter: "%1 do not know a better option exists, or cannot tell which one would suit them." },

/* Builds the hypothesis in the shape Phase 2 can actually test — who, when,

   shows any missing piece as a visible prompt rather than quietly papering
   over it. That visible gap is the point: it tells the user what to go and
   find out. */
function generateProblemStatementDraft(v) {
  const pid = v.hypothesis.problemId;
  const problem = assumptionText(v, "problem");
  const customer = assumptionText(v, "customer");
  const causes = (pid.causeExploration || []).map(x => (x || "").trim()).filter(Boolean);
  const alts = (pid.alternativeExplanations || []).map(x => (x || "").trim()).filter(Boolean);
  if (!problem && !causes.length) return "";

  const lower = (x) => x.charAt(0).toLowerCase() + x.slice(1);
  const stop = (x) => /[.!?]$/.test(x) ? x : x + ".";

  const who = !customer ? gap("who exactly?") : vagueWho ? frag(customer) + " " + gap("who exactly?") : frag(customer);

  const cost = frag(pid.consequence) || (hits(CONSEQUENCE_MARKERS, problem) ? "" : gap("what does it cost them?"));

     is what made the old draft unreadable. */
  /* English opens the sentence with the subject; Filipino puts it mid-clause
     ("Nararanasan ito ng ..."), where a capital reads wrong. Decide from the
     template that will actually be used. */
  const subjectFor = (key) => {
    const tmpl = (LANG !== "en" && DICT[LANG] && DICT[LANG][key]) ? DICT[LANG][key] : key;
    return tmpl.trim().indexOf("%1") === 0 ? who : lower(who);
  };

  lines.push(when
    ? t("%1 run into this %2: %3", subjectFor("%1 run into this %2: %3"), lower(when), stop(problem || gap("what is the difficulty?")))

  if (causes.length) lines.push(t("One possible explanation is that %1", stop(lower(causes[causes.length - 1]))));
  if (alts.length) lines.push(t("A competing explanation that has not been ruled out: %1", stop(lower(alts[0]))));

function generateSegmentDescriptionDraft(seg) {
  if (!seg.name.trim()) return "";
  let s = seg.name.trim();
  if (seg.occasion.trim()) s += t(", especially when %1", seg.occasion.trim());
  if (seg.need.trim()) s += t(". What they want: %1", seg.need.trim());
  return s + (/[.!?]$/.test(s) ? "" : ".");
}
/* =========================================================================

   Three failure modes a solution can have, and the tool should name them:

const COVERAGE_CONSEQUENCE = {
  "Attraction": "Nothing here explains why anyone would notice you in the first place.",
  "Conversion": "Nothing here explains why someone who turns up actually buys. Traffic without conversion is a busy shop losing money.",

  const counts = {};
  CONFIG.valueDriverCategories.forEach(c => { counts[c] = 0; });
  namedDrivers(v).forEach(d => { if (counts[d.category] !== undefined) counts[d.category]++; });
  return counts;

function solutionGaps(v) {
  const h = v.hypothesis;
  const comps = namedCompetitors(v);
  const drivers = namedDrivers(v);
  const gaps = [];

  if (!comps.length) {
    gaps.push({
      label: "Nothing recorded for what people do today",
      why: "You cannot claim to be better than an alternative you have not named. Start with what happens if you never open.",
      example: "\"Doing nothing / putting up with it\" is a real competitor, and usually the strongest one.",
    });
  } else if (!comps.some(countsAsStatusQuo)) {
    gaps.push({
      label: "Every alternative you listed is a business",
      why: "Most new ventures do not lose to a rival shop. They lose to people carrying on exactly as they are, which costs nothing and disappoints nobody.",
      example: "Add \"Doing nothing / putting up with it\" and write honestly what makes that comfortable.",
    });
  }

  const unbacked = drivers.filter(d => !(d.whyMatters || "").trim());
  if (unbacked.length) {
    gaps.push({
      label: "\"%1\" has no reason anyone would switch for it",
      labelArgs: [unbacked[0].name.trim()],
      why: "Every operator believes they have good service and good products. A driver only counts if it would move someone off what they already do.",
      example: "Not \"our coffee is good\" but \"they would walk past the 7-Eleven for it\".",
    });
  }

  const untied = drivers.filter(d => !(d.beats || "").trim());
  if (comps.length && untied.length) {
    gaps.push({
      label: "\"%1\" is not pointed at anything",
      labelArgs: [untied[0].name.trim()],
      why: "What makes you different has to beat something specific. Pick the alternative it wins against, or it is just a compliment, not a real claim.",
      example: "\"Being at the gate\" beats \"going somewhere further away\" — not everything at once.",

/* Two parts, both testable: what you would actually put in front of someone,

function generateSolutionHypothesisDraft(v) {
  const h = v.hypothesis;
  const drivers = namedDrivers(v);
  const comps = namedCompetitors(v);
  const frag = (x) => (x || "").trim().replace(/[.!?;,]+$/, "");
  const stop = (x) => /[.!?]$/.test(x) ? x : x + ".";
  const lower = (x) => x.charAt(0).toLowerCase() + x.slice(1);
  const gap = (key) => "[" + t(key) + "]";

  const offer = frag(h.smallestTest) || frag(assumptionText(v, "solution"));
  if (!offer && !drivers.length && !comps.length) return "";

  const who = frag(assumptionText(v, "customer")) || gap("who exactly?");
  const lines = [];
  lines.push(t("The offer: %1", stop(offer || gap("what exactly is the offer?"))));

  const reasons = drivers.map(d => frag(d.whyMatters) || frag(d.name)).filter(Boolean);
  const beaten = drivers.map(d => comps.find(c => c.id === d.beats)).filter(Boolean)

const VALIDATION_KEYS = ["problem", "customer", "solution.competitive", "solution.market", "solution.product", "future.baseline", "future.growth"];

    "solution.market": v.validation.solution.market,
    "solution.product": v.validation.solution.product,
    "future.baseline": v.validation.futureDirection.baseline,

const ELEMENT_TITLES = { problem: "Problem", customer: "Customer", solution: "Solution" };

/* The single source of truth for what an element may be called right now. */

const OUTCOME_MOVES = {
  "Partially supported": ["Refine", "Retest"],
  "Not supported": ["Replace", "Reject"],
  "Inconclusive": ["Retest", "Refine"],
};

/* Plain-language progress label used on the dashboard and the profile.
   No "gate" language for the starting assumptions. */
function ventureStatusKey(v) {
  if (insightsSufficientlySupported(v)) return "Insights sufficiently supported";
  if (VALIDATION_KEYS.some(k => validationStarted(getValidationCard(v, k)))) return "Validation in progress";
  if (hypothesisGateComplete(v)) return "Ready for validation";
  if (anyHypothesisWritten(v) || snapshotComplete(v)) return "Hypotheses in development";
  if (snapshotStarted(v)) return "Starting statement in progress";
  return "Starting statement not written";
}
function ventureStatus(v) { return t(ventureStatusKey(v)); }

/* =========================================================================
   PROGRESS / MILESTONES
   Deliberately not points, streaks or badges. The people using this are
   making real decisions about their livelihood; scoring that would cheapen
   it and undercut the credibility the tool depends on. What is rewarding
   here is evidence of your own progress — how far along you are, what you
   have actually built, and being told plainly when you cross something most
   people never reach.

   The stages are the ladder the tool already tracks, not new invented ones.
   ========================================================================= */
const JOURNEY_STAGES = [
  { key: "Starting statement not written",  short: "Getting started" },
  { key: "Starting statement in progress",  short: "First answers down" },
  { key: "Hypotheses in development",         short: "Building hypotheses" },
  { key: "Ready for validation",              short: "Ready to test" },
  { key: "Validation in progress",            short: "Gathering evidence" },
  { key: "Insights sufficiently supported",   short: "Evidence-backed" },
];
function journeyIndex(v) {
  const k = ventureStatusKey(v);
  const i = JOURNEY_STAGES.findIndex(s => s.key === k);
  return i < 0 ? 0 : i;
}
/* A count of what the person has actually produced — not a score. Every
   number here points at something real they can go and look at. */
function progressTally(v) {
  const answered = ELEMENT_KEYS.filter(k => assumptionAnswered(v, k)).length;
  const hypotheses = ELEMENT_KEYS.filter(k => elementHypothesisWritten(v, k)).length;
  const insights = ELEMENT_KEYS.filter(k => hasInsight(v, k)).length;
  const tested = VALIDATION_KEYS.filter(k => validationTestComplete(getValidationCard(v, k))).length;
  return { answered, hypotheses, insights, tested, evidence: (v.evidence || []).length };
}
/* The journey bar: where you are on the road, and what is left. */
function journeyBar(v) {
  const idx = journeyIndex(v);
  const pct = Math.round((idx / (JOURNEY_STAGES.length - 1)) * 100);
  return `
  <div class="fs-journey">
    <div class="fs-journey-bar"><span style="width:${pct}%"></span></div>
    <div class="fs-journey-stages">
      ${JOURNEY_STAGES.map((s, i) => `<span class="${i < idx ? "is-done" : i === idx ? "is-now" : ""}">${esc(t(s.short))}</span>`).join("")}
    </div>
  </div>`;
}
/* What you have built so far, in plain counts. Only shows once there is
   something in it — an all-zeroes scoreboard on day one is discouraging,
   which is the opposite of the point. */
function progressTallyStrip(v) {
  const c = progressTally(v);
  if (!c.answered && !c.hypotheses && !c.insights && !c.evidence) return "";
  const cell = (n, one, many, on) =>
    `<div class="fs-tally-cell ${on ? "is-on" : ""}"><strong>${n}</strong><span>${esc(t(n === 1 ? one : many))}</span></div>`;
  return `
  <div class="fs-tally">
    ${cell(c.answered, "starting assumption", "starting assumptions", c.answered > 0)}
    ${cell(c.hypotheses, "testable hypothesis", "testable hypotheses", c.hypotheses > 0)}
    ${cell(c.evidence, "piece of evidence", "pieces of evidence", c.evidence > 0)}
    ${cell(c.insights, "evidence-backed insight", "evidence-backed insights", c.insights > 0)}
  </div>`;
}
function generateMissionDraft(v) {
  const p = v.validation.problem, c = v.validation.customer;
  const pText = p.interpretation || p.actualResult;
  const cText = c.interpretation || c.actualResult;
  if (!pText && !cText) return "";
  /* Only call something an insight if Phase 2 actually supported it. */
  const pWord = t(hasInsight(v, "problem") ? "an evidence-backed problem" : "a problem we are still validating");
  const cWord = t(hasInsight(v, "customer") ? "an evidence-backed customer" : "a customer we are still validating");
  return t("We exist to address %1 — %2 — for %3: %4.", pWord, pText || t("(problem validation not yet interpreted)"), cWord, cText || t("(customer validation not yet interpreted)"));
}
function generateVisionDraft(v) {
  const g = v.validation.futureDirection.growth;
  const gText = g.interpretation || g.actualResult;
  if (!gText) return "";
  const hedge = t(g.outcome === "Supported" ? "Where the evidence says this can go" : "Where this could go, on evidence that is not yet conclusive");
  return t("%1, if the baseline holds: %2", hedge, gText);
}
function validationContextNote(v, key) {
  if (key === "problem" && v.hypothesis.problemId.problemStatement) return t('From Phase 1: "%1"', v.hypothesis.problemId.problemStatement);
  if (key === "customer") { const seg = v.hypothesis.segments.find(s => s.prioritized); if (seg) return t('From Phase 1 — priority segment: "%1"', seg.name); }
  return "";
}

/* ---------------- Shared explanatory fragments ---------------- */
/* Every AI-written line in this tool carries the same label, so a draft can
   never be mistaken for something the user confirmed. */
const SUGGEST_LABEL = "Suggested draft — confirm or edit before use";
function suggestBox(text, actionsHtml, label) {
  return `<div class="fs-suggest-box"><div class="fs-suggest-label">${esc(label || t(SUGGEST_LABEL))}</div><p style="white-space:pre-line">${esc(text)}</p>${actionsHtml ? `<div class="fs-suggest-actions">${actionsHtml}</div>` : ""}</div>`;
}
/* Progressive disclosure: the vocabulary is available where it is first
   needed, but nobody has to read it before starting. */
function termsGlossary() {
  const row = (term, def) => `<dt>${esc(t(term))}</dt><dd>${esc(t(def))}</dd>`;
  return `<details class="fs-glossary">
    <summary>${esc(t("What these five words mean here"))} &darr;</summary>
    <dl>
      ${row("Observation", "What was directly seen or measured.")}
      ${row("Assumption", "Your best current answer — not yet properly examined.")}
      ${row("Hypothesis", "A clearer, testable explanation or proposition.")}
      ${row("Evidence", "What you gathered through observation, interviews, experiments, transactions, or another credible method.")}
      ${row("Insight", "An understanding the evidence sufficiently supports.")}
    </dl>
  </details>`;
}
/* Assumption → Hypothesis → Insight, with the current rung marked. */
function ladder(now) {
  const steps = ["Assumption", "Hypothesis", "Insight"];
  return `<p class="fs-ladder">${steps.map((s, i) => `<span class="${s === now ? "is-now" : ""}">${esc(t(s))}</span>${i < 2 ? "<i>&rarr;</i>" : ""}`).join("")}</p>`;
}
function demoFlag(v) {
  if (!/^DEMO/.test(v.name || "")) return "";
  return `<div class="fs-demo-flag"><strong>${esc(t("Fictional demo case."))}</strong> ${esc(t("Every entry here is made up and unvalidated. Nothing becomes an insight until real evidence is entered in Phase 2."))}</div>`;

function evidencePill(label) {

    go("dashboard");
  });
  document.getElementById("fsNewVenture")?.addEventListener("click", startNew);

}

/* Fields the tool still asks for. Everything else that used to be on this
   screen — stage, industry, location, summary, business model, dates, and
   seven lines of financial intake — was removed rather than tucked into an
   accordion: none of it changes what the framework does next, and a wall of
   optional boxes is exactly what stops people finishing this screen.
   Values already saved in those fields are never destroyed; they surface in
   a collapsed block below so nothing is lost. */
const RETIRED_PROFILE_FIELDS = [
  ["urgentConstraint", "What is making this urgent?"],
  ["desiredOutcome", "What do you want to get out of this?"],
  ["owner", "Owner / founder"],
  ["stage", "Business stage"],
  ["industry", "Industry / category"],
  ["location", "Location / market area"],
  ["summary", "Venture summary"],
  ["businessModel", "Current business model / intended format"],
  ["startDate", "Start / opening date"],
  ["decisionDate", "Decision date"],
];
const RETIRED_INTAKE_FIELDS = [
  ["traffic", "Traffic / inquiries"],
  ["conversion", "Conversion"],
  ["avgTransaction", "Average transaction"],
  ["repeatBehavior", "Repeat behavior"],
  ["grossMargin", "Gross margin / contribution"],
  ["fixedCosts", "Fixed costs"],
  ["ownerDependency", "Owner dependency"],
];
function retiredProfileValues(v) {
  const out = [];
  RETIRED_PROFILE_FIELDS.forEach(([k, label]) => { if ((v[k] || "").trim()) out.push(["f_old_" + k, label, v[k]]); });
  RETIRED_INTAKE_FIELDS.forEach(([k, label]) => { if (((v.existingIntake || {})[k] || "").trim()) out.push(["ei_old_" + k, label, v.existingIntake[k]]); });
  return out;
}

/* =========================================================================
   STEP FLOW ENGINE
   One thing to think about per screen, reusable by any section.

   "One question per page" here means one focused task, not literally one
   input — a step that asks "who are your customers?" can hold the list of
   segments, because that is still one thing to think about. Splitting a
   single task across pages would add taps without reducing load.

   Each step: { id, question, hint?, example?, body(), bind?(), skippable? }
   Position is tracked per venture per flow, so leaving and returning lands
   you where you were rather than back at the start.
   ========================================================================= */
const FLOW_POS = {};
function flowKey(v, flowId) { return v.id + "." + flowId; }
function flowIndex(v, flowId, total) {
  const k = flowKey(v, flowId);
  let i = FLOW_POS[k] || 0;
  if (i >= total) i = total - 1;
  if (i < 0) i = 0;
  FLOW_POS[k] = i;
  return i;
}
function setFlowIndex(v, flowId, i) { FLOW_POS[flowKey(v, flowId)] = i; }

/* Renders one step of a flow. `onFinish` runs when the last step is passed —
   usually moving to the next section. */
function renderStepFlow(v, flowId, steps, onFinish) {
  if (!steps.length) return "";
  const idx = flowIndex(v, flowId, steps.length);
  const step = steps[idx];
  const isLast = idx === steps.length - 1;
  const pct = Math.round(((idx + 1) / steps.length) * 100);
  return `
  <div class="fs-flow" data-flow="${esc(flowId)}">
    <div class="fs-flow-progress">
      <div class="fs-flow-bar"><span style="width:${pct}%"></span></div>
      <p>${esc(t("Step %1 of %2", idx + 1, steps.length))}</p>
    </div>
    <div class="fs-flow-card">
      <h2 class="fs-flow-q">${esc(t(step.question))}</h2>
      ${step.hint ? `<p class="fs-hint">${esc(t(step.hint))}</p>` : ""}
      ${step.example ? `<div class="fs-example">${esc(t("Example: %1", t(step.example)))}</div>` : ""}
      ${step.body()}
    </div>
    <div class="fs-flow-nav">
      ${idx > 0 ? `<button class="fs-btn fs-btn-ghost" data-flowback="${esc(flowId)}">&#8592; ${esc(t("Back"))}</button>` : `<span></span>`}
      <button class="fs-btn" data-flownext="${esc(flowId)}">${esc(isLast ? t("Done") : t("Next"))} &#8594;</button>
    </div>
  </div>`;
}
/* Wires Back/Next for a flow and runs the current step's own bindings. */
function bindStepFlow(v, flowId, steps, onFinish) {
  if (!steps.length) return;
  const idx = flowIndex(v, flowId, steps.length);
  const step = steps[idx];
  if (step.bind) step.bind();
  document.querySelector(`[data-flowback="${flowId}"]`)?.addEventListener("click", () => {
    if (step.commit) step.commit();
    setFlowIndex(v, flowId, idx - 1);
    refresh();
  });
  document.querySelector(`[data-flownext="${flowId}"]`)?.addEventListener("click", () => {
    if (step.commit) step.commit();
    if (idx === steps.length - 1) { if (onFinish) onFinish(); return; }
    setFlowIndex(v, flowId, idx + 1);
    refresh();
  });
}

/* =========================================================================
   PROFILE WIZARD — one question per screen
   The single-question form pattern. It trades "everything visible at once"
   for "only one thing to think about", which is the right trade here: the
   profile is already down to a handful of real questions, so this is not
   hiding a long list behind folds — it is pacing a short one.

   The cost is more taps. Two things pay that back: a visible step counter
   (people push harder as a finish line gets closer) and an explicit
   acknowledgement at the end, so the extra taps end in something rather
   than just stopping.
   ========================================================================= */
function profileSteps(v) {
  const steps = [{
    id: "start",
    question: "What do you have so far?",
    body: () => `
      <div class="fs-startpoint">
        ${STARTING_POINTS.map(s => `<button type="button" class="fs-startpoint-card ${v.startingPoint === s.id ? "is-on" : ""}" data-startpoint="${s.id}">${esc(t(s.label))}</button>`).join("")}
      </div>`,
    bind: () => {
      document.querySelectorAll("[data-startpoint]").forEach(btn => btn.addEventListener("click", () => {
        v.startingPoint = btn.dataset.startpoint;
        touchVenture(v);
        refresh();
      }));
    },
  }];

  /* Whichever element they said they were starting from is asked first —
     answering the one you already have in your head is a much easier first
     move than answering the one the form happens to list first. */
  snapshotOrder(v).forEach(key => steps.push(elementStep(v, key)));

  /* The welcome screen already asked what kind of case this is, and what the
     business is called. Neither is asked again here. */
  if (v.mode === "existing-business") {
    steps.push({
      id: "trigger",
      question: "What made you look into this?",
      example: "I am working every day but there is nothing left at the end of the month.",
      body: () => `<div class="fs-field" style="margin-bottom:0"><textarea id="wz_trigger" style="min-height:110px">${esc(v.existingIntake.auditTrigger)}</textarea></div>`,
      commit: () => { const el = document.getElementById("wz_trigger"); if (el) { v.existingIntake.auditTrigger = el.value; touchVenture(v); } },
    });
    steps.push({
      id: "performance",
      question: "Roughly how is it doing now?",
      hint: "A rough figure is fine — this is a starting point, not an audit.",
      body: () => `<div class="fs-field" style="margin-bottom:0"><input type="text" id="wz_perf" value="${esc(v.existingIntake.performance)}" placeholder="${esc(t("e.g. ₱45k/mo revenue"))}"></div>`,
      commit: () => { const el = document.getElementById("wz_perf"); if (el) { v.existingIntake.performance = el.value; touchVenture(v); } },
    });
  }

  steps.push({
    id: "base",
    question: "Here is your starting statement",
    body: () => baseStatementBlock(v, "This is the base everything else builds on. It is a starting guess, not a finding — Phase 1 turns it into hypotheses you can test.", true),
  });
  return steps;
}

function renderProfileWizard(v) {
  const main = document.getElementById("fsMain");
  const steps = profileSteps(v);
  const finish = () => finishProfileWizard(v);
  main.innerHTML = `
  <div class="fs-wizard">
    ${renderStepFlow(v, "profile", steps, finish)}
    <button class="fs-wizard-skip" id="wz_skip">${esc(t("Skip this for now"))}</button>
  </div>`;
  bindStepFlow(v, "profile", steps, finish);
  document.getElementById("wz_skip").addEventListener("click", finish);
}
function finishProfileWizard(v) {
  v.profileOnboarded = true;
  setFlowIndex(v, "profile", 0);
  touchVenture(v);
  go("profile", v.id);
}

/* The one moment worth marking: a hypothesis has survived real evidence.
   Shown once, then dismissed for good — a banner that reappears forever
   stops meaning anything. */
function milestoneBanner(v) {
  if (!insightsSufficientlySupported(v)) return "";
  if (v.insightCelebrationShown) return "";
  return `
  <div class="fs-milestone">
    <p class="fs-milestone-eyebrow">${esc(t("Worth stopping for"))}</p>
    <h2>${esc(t("All three now hold up against real evidence."))}</h2>
    <p>${esc(t("Your problem, your customer and your solution started as guesses. You tested them and they survived. Most people never get this far — they open, and find out afterwards."))}</p>
    <button class="fs-btn fs-btn-ghost fs-btn-sm" id="fsMilestoneDone">${esc(t("Continue"))}</button>
  </div>`;
}

function elementQuickPick(v, key) {
  const heading = ELEMENT_QUESTIONS[key];
  if (key === "solution") return renderSolutionQuickPick(v, heading, true);
  if (key === "customer") return renderCustomerQuickPick(v, heading);
  return renderProblemQuickPick(v, heading);
}

/* Only writes fields that are actually on screen. A field the current mode
   does not render keeps whatever the venture already had — switching modes
   must never silently wipe data. */
function saveProfileFields(v) {
  const set = (id, apply) => { const el = document.getElementById(id); if (el) apply(el.value); };
  set("qp_solution_name", x => { if (x.trim()) v.name = x.trim(); });
  saveQuickPick(v, "solution", "qp_solution", INDUSTRY_OPTIONS);
  saveQuickPick(v, "customer", "qp_customer", CUSTOMER_SEGMENT_OPTIONS);
  saveProblemDetail(v);
  set("f_consultant", x => { v.consultant = x; });
  set("f_deadline", x => { v.deadline = x; });
  set("f_scope", x => { v.scope = x; });
  set("ei_trigger", x => { v.existingIntake.auditTrigger = x; });
  set("ei_performance", x => { v.existingIntake.performance = x; });
  RETIRED_PROFILE_FIELDS.forEach(([k]) => set("f_old_" + k, x => { v[k] = x; }));
  RETIRED_INTAKE_FIELDS.forEach(([k]) => set("ei_old_" + k, x => { v.existingIntake[k] = x; }));
  touchVenture(v);
  renderNav();
}
